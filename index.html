<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentlis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0b0b0c;
  --bg-elev:#141416;
  --surface:#1a1a1d;
  --surface-2:#212124;
  --border:#2a2a2e;
  --border-soft:#232326;
  --text:#f2f2f3;
  --text-dim:#9a9aa0;
  --text-faint:#5c5c62;
  --white:#ffffff;
  --r-s:10px;
  --r-m:16px;
  --r-l:26px;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
  --font-m:'IBM Plex Mono',monospace;
  --nav-h:64px;
}
body.true-black{
  --bg:#000000;
  --bg-elev:#070707;
  --surface:#0e0e0f;
  --surface-2:#151517;
  --border:#232325;
}
/* ============ ALTERNATE THEMES ============
   Same variable set as the default dark theme, just different values —
   every existing rule already reads these vars, so switching body class
   re-skins the whole app without touching any layout or component CSS. */
body.theme-anime{
  --bg:#160a1f; --bg-elev:#1e0f2b; --surface:#2a1338; --surface-2:#341745;
  --border:#4a1f5c; --border-soft:#3a1a4a;
  --text:#fbe9ff; --text-dim:#d9a8f0; --text-faint:#8a5aa3;
  --white:#ff8fd6; --accent:#ff5fb8;
}
body.theme-anime .logo, body.theme-anime .coin-ico{ filter:saturate(1.3); }
body.theme-nature{
  --bg:#0f1710; --bg-elev:#152016; --surface:#1c2b1e; --surface-2:#233524;
  --border:#31472f; --border-soft:#293b28;
  --text:#eaf5e6; --text-dim:#a8c9a0; --text-faint:#6e8a68;
  --white:#c8f2a0; --accent:#7fc95a;
}
body.theme-ocean{
  --bg:#061620; --bg-elev:#0a1f2e; --surface:#0f2a3d; --surface-2:#13354a;
  --border:#1c4a63; --border-soft:#173d52;
  --text:#e3f6ff; --text-dim:#8fc9dd; --text-faint:#4f8299;
  --white:#7fe3ff; --accent:#4fc3ff;
}
body.theme-sunset{
  --bg:#1a0e0a; --bg-elev:#241209; --surface:#331a0e; --surface-2:#402210;
  --border:#5c3216; --border-soft:#4a2812;
  --text:#fff1e6; --text-dim:#ecb896; --text-faint:#a67352;
  --white:#ffb37a; --accent:#ff8a4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:#000;
  font-family:var(--font-b);
  color:var(--text);
  overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;}
input,textarea{font-family:inherit;color:inherit;}
::selection{background:var(--white);color:#000;}
svg{display:block;}
.icon{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
a{color:inherit;text-decoration:none;}

/* ============ APP FRAME ============ */
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  box-shadow:0 0 80px rgba(255,255,255,.04);
  overflow-x:hidden;
}
#scroll-progress{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  max-width:480px;width:100%;height:2px;z-index:60;pointer-events:none;
}
#scroll-progress i{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,transparent,var(--white),transparent);
  transition:width .08s linear;
}

/* ============ AUTH SCREEN ============ */
#auth-screen{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--white) 10%, transparent), transparent 55%), var(--bg);
}
.auth-card{width:100%;max-width:380px;}
.auth-brand{
  font-family:var(--font-d);font-weight:700;font-size:34px;letter-spacing:-.03em;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.auth-brand i{width:8px;height:8px;border-radius:50%;background:var(--white);animation:pulse-dot 2.4s ease-in-out infinite;}
.auth-tagline{text-align:center;color:var(--text-dim);font-size:14px;margin-top:6px;margin-bottom:28px;}
.auth-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border-soft);border-radius:999px;padding:4px;margin-bottom:22px;}
.auth-tab{flex:1;padding:10px 0;border-radius:999px;background:none;border:none;font-size:14px;font-weight:600;color:var(--text-dim);}
.auth-tab.active{background:var(--white);color:#000;}
.auth-form{display:flex;flex-direction:column;gap:14px;}
.auth-field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
.auth-input-wrap{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:0 14px;}
.auth-input-wrap:focus-within{border-color:var(--white);}
.auth-input-wrap input{flex:1;background:none;border:none;padding:13px 0;font-size:15px;color:var(--text);min-width:0;}
.auth-input-wrap input::placeholder{color:var(--text-faint);}
.auth-at{color:var(--text-faint);font-family:var(--font-m);font-size:15px;margin-right:2px;}
.auth-field > input{width:100%;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:13px 14px;font-size:15px;color:var(--text);}
.auth-field > input:focus{border-color:var(--white);}
.auth-eye{background:none;border:none;font-size:16px;padding:8px 0 8px 8px;opacity:.6;flex-shrink:0;}
.auth-error{color:#ff7a7a;font-size:13px;min-height:0;display:none;}
.auth-error.show{display:block;}
.auth-submit{
  width:100%;padding:15px 0;border-radius:14px;background:var(--white);color:#000;border:none;
  font-size:15px;font-weight:700;margin-top:4px;
}
.auth-submit:active{opacity:.85;}
.auth-footnote{text-align:center;color:var(--text-faint);font-size:12px;margin-top:20px;}
.auth-switch-hint{text-align:center;color:var(--text-faint);font-size:13px;margin-top:16px;}

/* ============ HEADER ============ */
.header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;
  background:linear-gradient(var(--bg) 70%, transparent);
  backdrop-filter:blur(10px);
}
.logo{
  font-family:var(--font-d);font-weight:700;font-size:21px;letter-spacing:-.03em;
  display:flex;align-items:center;gap:6px;
}
.logo i{
  width:6px;height:6px;border-radius:50%;background:var(--white);
  animation:pulse-dot 2.4s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(1.6);}}
.header-btn{
  width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;color:var(--text);
}
.header-sub{padding:0 18px 12px;}
.header-title{
  font-family:var(--font-d);font-weight:600;font-size:19px;letter-spacing:-.02em;
}
.header-row{display:flex;align-items:center;gap:14px;padding:14px 16px;}
.back-btn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ============ CHANNEL CHIPS ============ */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:0 18px 14px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border-soft);
  font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap;
}
.chip.active{background:var(--white);color:#000;border-color:var(--white);}

/* ============ FEED / VIEWS ============ */
.view{display:none;padding-bottom:calc(var(--nav-h) + 14px);}
.view.active{display:block;}
.feed{display:flex;flex-direction:column;}
.empty-state{padding:60px 30px;text-align:center;color:var(--text-faint);}
.empty-state .icon{width:34px;height:34px;margin:0 auto 14px;opacity:.5;}
.empty-state h4{font-family:var(--font-d);color:var(--text-dim);font-weight:600;margin:0 0 6px;font-size:15px;}
.empty-state p{margin:0;font-size:13px;line-height:1.5;}

/* ============ AVATAR / LIVE RING ============ */
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar-wrap.live::before{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from calc(var(--ang,0)*1deg), transparent 0%, #fff 18%, transparent 40%);
  animation:spin-ring 3.2s linear infinite;
}
.avatar-wrap.live::after{
  content:'';position:absolute;inset:0;border-radius:50%;background:var(--bg);
}
.avatar-wrap.live .avatar{position:relative;z-index:1;}
@keyframes spin-ring{to{--ang:360;}}
@property --ang{syntax:'<number>';inherits:true;initial-value:0;}
.avatar{
  border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-weight:600;color:#0a0a0a;background:#c8c8ca;overflow:hidden;
}

/* ============ POST CARD ============ */
.post{padding:16px 18px;border-bottom:1px solid var(--border-soft);}
.post-head{display:flex;gap:11px;}
.co-author-avatars{display:flex;align-items:center;flex-shrink:0;height:40px;}
.co-avatar{display:block;position:relative;cursor:pointer;border-radius:50%;background:var(--bg);padding:2px;margin-left:-14px;}
.co-avatar:first-child{margin-left:0;}
.post-meta.co{flex-wrap:wrap;row-gap:3px;}
.post-name-group{display:flex;flex-wrap:wrap;width:100%;}
.post-name-group .post-name{white-space:nowrap;}
.post-name-sep{color:var(--text-faint);font-weight:400;white-space:nowrap;}
.post-body{flex:1;min-width:0;}
.post-meta{display:flex;align-items:center;gap:6px;font-size:14px;}
.post-name{font-weight:700;color:var(--text);}
.post-handle{color:var(--text-faint);font-family:var(--font-m);font-size:12px;}
.post-dot{color:var(--text-faint);font-size:10px;}
.post-time{color:var(--text-faint);font-family:var(--font-m);font-size:12px;}
.post-channel-tag{
  font-family:var(--font-m);font-size:11px;font-weight:600;color:var(--text);background:var(--surface-2);
  padding:3px 9px 3px 7px;border-radius:999px;border:1px solid var(--border-soft);margin-left:auto;flex-shrink:0;
  display:inline-flex;align-items:center;gap:4px;
}
.post-channel-tag .icon{width:11px;height:11px;stroke-width:2.4;}
.post-personal-tag{
  font-family:var(--font-m);font-size:10.5px;color:var(--text-faint);background:none;
  padding:0;margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:3px;
}
.post-personal-tag .icon{width:11px;height:11px;stroke-width:2.2;opacity:.7;}
.post-text{margin:6px 0 0;font-size:15px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-wrap:break-word;}
.translate-btn{display:inline-flex;align-items:center;gap:5px;margin-top:6px;background:none;border:none;padding:0;color:var(--accent,#6d8bff);font-size:13px;font-weight:600;}
.translate-btn:disabled{opacity:.6;}
.translate-btn .icon{width:13px;height:13px;}
.post-media{margin-top:10px;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--border-soft);position:relative;}
.post-media img{width:100%;display:block;max-height:420px;object-fit:cover;}
.dbl-burst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;}
.dbl-burst svg{width:64px;height:64px;filter:drop-shadow(0 6px 22px rgba(0,0,0,.55));transform:scale(.4);}
.dbl-burst svg rect{fill:#fff;}
.dbl-burst.go{animation:dbl-fade .7s cubic-bezier(.22,.9,.3,1) forwards;}
.dbl-burst.go svg{animation:dbl-scale .7s cubic-bezier(.22,.9,.3,1) forwards;}
@keyframes dbl-fade{0%{opacity:0;}14%{opacity:1;}68%{opacity:1;}100%{opacity:0;}}
@keyframes dbl-scale{0%{transform:scale(.3);}32%{transform:scale(1.18);}48%{transform:scale(.94);}65%{transform:scale(1.05);}100%{transform:scale(1);}}
.post-actions{display:flex;align-items:center;gap:22px;margin-top:12px;}
.act-btn{
  display:flex;align-items:center;gap:6px;background:none;border:none;padding:4px 0;color:var(--text-dim);
  font-family:var(--font-m);font-size:13px;cursor:pointer;
}
.act-btn .icon{width:19px;height:19px;transition:transform .15s ease;}
.act-btn.bookmark{margin-left:auto;}
.act-btn.bookmark.on .icon{fill:var(--white);stroke:var(--white);}
.act-btn.repost.on{color:var(--text);}
.act-btn.repost.on .icon{stroke:var(--white);}

/* resonance (like) button — signature interaction */
.resonance-btn{position:relative;}
.resonance-btn .icon rect{transition:height .35s ease, y .35s ease;}
.resonance-btn.on{color:var(--white);}
.resonance-btn.on .icon rect{animation:eq-bounce .9s ease-in-out infinite;}
.resonance-btn.on .icon rect:nth-child(1){animation-delay:.05s;}
.resonance-btn.on .icon rect:nth-child(2){animation-delay:.15s;}
.resonance-btn.on .icon rect:nth-child(3){animation-delay:.25s;}
@keyframes eq-bounce{0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.55);}}
.resonance-btn .burst{
  position:absolute;left:-9px;top:-9px;width:38px;height:38px;border-radius:50%;
  border:1.5px solid var(--white);opacity:0;pointer-events:none;
}
.resonance-btn.bursting .burst{animation:burst-ring .6s ease-out forwards;}
@keyframes burst-ring{0%{opacity:.9;transform:scale(.3);}100%{opacity:0;transform:scale(1.7);}}
.count-pop{display:inline-block;}
.count-pop.pop{animation:pop-num .32s ease;}
@keyframes pop-num{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}

/* ============ POLL ============ */
.poll{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.poll-opt{
  position:relative;border:1px solid var(--border);border-radius:var(--r-s);padding:11px 14px;
  overflow:hidden;cursor:pointer;background:var(--surface);
}
.poll-opt-fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--surface-2);
  transition:width .55s cubic-bezier(.22,.9,.3,1);
}
.poll-opt.voted-choice{border-color:var(--white);}
.poll-opt-label{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px;font-size:14px;}
.poll-opt-pct{font-family:var(--font-m);color:var(--text-dim);font-size:13px;flex-shrink:0;}
.poll-opt.voted-choice .poll-opt-pct{color:var(--text);}
.poll-meta{font-family:var(--font-m);font-size:11.5px;color:var(--text-faint);margin-top:2px;}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  height:var(--nav-h);background:rgba(11,11,12,.86);backdrop-filter:blur(16px);
  border-top:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-around;
  z-index:50;
}
body.true-black .bottom-nav{background:rgba(0,0,0,.88);}
.nav-btn{background:none;border:none;color:var(--text-faint);display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;height:52px;justify-content:center;border-radius:14px;}
.nav-btn.active{color:var(--white);}
.nav-btn .dot{width:3px;height:3px;border-radius:50%;background:var(--white);opacity:0;}
.nav-btn.active .dot{opacity:1;}
.nav-fab{
  width:50px;height:50px;border-radius:50%;background:var(--white);color:#000;
  display:flex;align-items:center;justify-content:center;border:none;
  box-shadow:0 6px 18px rgba(255,255,255,.15);flex-shrink:0;
}
.nav-fab .icon{stroke:#000;width:24px;height:24px;}

/* ============ SHEETS / MODALS ============ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet-wrap{position:fixed;inset:0;z-index:81;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;}
.sheet{
  width:100%;max-width:480px;max-height:88vh;background:var(--bg-elev);border-radius:22px 22px 0 0;
  border:1px solid var(--border-soft);border-bottom:none;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  display:flex;flex-direction:column;pointer-events:auto;overflow:hidden;
}
.overlay.show + .sheet-wrap .sheet, .sheet-wrap.show .sheet{transform:translateY(0);}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 0;flex-shrink:0;}
.sheet-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-soft);flex-shrink:0;}
.sheet-title{font-family:var(--font-d);font-weight:600;font-size:16px;}
.txt-btn{background:none;border:none;font-size:14.5px;font-weight:600;color:var(--text-dim);padding:6px 4px;}
.txt-btn.primary{color:#000;background:var(--white);padding:8px 16px;border-radius:999px;}
.txt-btn.primary:disabled{background:var(--surface-2);color:var(--text-faint);}
.sheet-body{overflow-y:auto;padding:16px;flex:1;}

/* Composer */
.composer-author{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.composer-author .name{font-weight:700;font-size:14.5px;}
.channel-pill{
  margin-left:auto;display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border-soft);
  padding:6px 11px;border-radius:999px;font-size:12.5px;color:var(--text-dim);position:relative;font-weight:600;
}
.channel-pill .icon{width:14px;height:14px;}
.channel-menu{
  position:absolute;top:110%;right:0;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;
  min-width:180px;padding:6px;display:none;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.5);
}
.channel-menu.show{display:block;}
.channel-menu-item{padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--text);cursor:pointer;}
.channel-menu-item:hover,.channel-menu-item.sel{background:var(--surface-2);}
.composer-textarea{
  width:100%;border:none;background:none;color:var(--text);font-size:16.5px;line-height:1.5;resize:none;
  min-height:90px;outline:none;font-family:var(--font-b);
}
.composer-textarea::placeholder{color:var(--text-faint);}
.attach-toolbar{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border-soft);margin-top:6px;}
.attach-btn{
  width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);
}
.attach-btn.active{background:var(--white);color:#000;border-color:var(--white);}
.attach-btn .icon{width:18px;height:18px;}
.img-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;}
.img-thumb{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;border:1px solid var(--border-soft);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb .rm{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;}
.img-thumb .rm .icon{width:13px;height:13px;stroke:#fff;}
.poll-build{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.poll-build input{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:11px 13px;
  font-size:14.5px;outline:none;width:100%;
}
.poll-build input::placeholder{color:var(--text-faint);}
.poll-opt-row{display:flex;align-items:center;gap:8px;}
.poll-opt-row input{flex:1;}
.poll-opt-row .rm-opt{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.poll-opt-row .rm-opt .icon{width:14px;height:14px;}
.add-opt-btn{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13.5px;font-weight:600;background:none;border:none;padding:6px 2px;align-self:flex-start;}
.add-opt-btn .icon{width:15px;height:15px;}

/* Comments sheet */
.comment-row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-soft);align-items:flex-start;}
.comment-row:last-child{border-bottom:none;}
.comment-row.reply-row{padding:0;border-bottom:none;}
.comment-bubble{flex:1;min-width:0;}
.comment-bubble .name{font-weight:700;font-size:13.5px;}
.comment-bubble .time{font-family:var(--font-m);color:var(--text-faint);font-size:11px;margin-left:6px;}
.comment-bubble p{margin:3px 0 0;font-size:14px;line-height:1.45;}
.comment-img{margin-top:8px;max-width:170px;max-height:170px;border-radius:12px;display:block;border:1px solid var(--border-soft);cursor:pointer;object-fit:cover;}
.reply-link{background:none;border:none;padding:0;margin-top:6px;font-size:12px;font-weight:700;color:var(--text-faint);cursor:pointer;}
.comment-replies{margin-top:10px;padding-left:14px;border-left:1px solid var(--border-soft);display:flex;flex-direction:column;gap:12px;}
.comment-row.reply-row{position:relative;}
.comment-row.reply-row::before{content:'';position:absolute;left:-14px;top:16px;width:11px;height:1px;background:var(--border-soft);}
.reply-pill{display:none;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;background:var(--surface);border-top:1px solid var(--border-soft);flex-shrink:0;}
.reply-pill span{font-size:12.5px;font-weight:600;color:var(--text-dim);}
.reply-pill button{background:none;border:none;color:var(--text-faint);width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.comment-img-preview{display:none;padding:10px 16px 0;background:var(--bg-elev);flex-shrink:0;}
.cip-thumb{position:relative;width:56px;height:56px;border-radius:12px;overflow:hidden;border:1px solid var(--border-soft);}
.cip-thumb img{width:100%;height:100%;object-fit:cover;}
.cip-thumb button{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;border:none;}
.cip-thumb button svg{width:10px;height:10px;stroke:#fff;}
.comment-input-row{
  display:flex;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--border-soft);flex-shrink:0;
  background:var(--bg-elev);
}
.comment-input-row input{
  flex:1;background:var(--surface);border:1px solid var(--border-soft);border-radius:999px;padding:10px 15px;
  font-size:14px;outline:none;min-width:0;
}
.comment-attach-btn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-dim);}
.comment-attach-btn .icon{width:16px;height:16px;}
.comment-send{width:36px;height:36px;border-radius:50%;background:var(--white);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.comment-send .icon{width:16px;height:16px;stroke:#000;}
.comment-send:disabled{background:var(--surface-2);}
.comment-send:disabled .icon{stroke:var(--text-faint);}

/* ============ SEARCH ============ */
.search-input-wrap{display:flex;align-items:center;gap:10px;padding:10px 18px 0;}
.search-box{
  flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border-soft);
  border-radius:14px;padding:11px 14px;
}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;}
.search-box input::placeholder{color:var(--text-faint);}
.search-box .icon{width:18px;height:18px;color:var(--text-faint);flex-shrink:0;}
.search-tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 18px;scrollbar-width:none;}
.search-tabs::-webkit-scrollbar{display:none;}
.stab{flex-shrink:0;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.stab.active{background:var(--white);color:#000;border-color:var(--white);}
.result-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-soft);}
.result-row .rtext{flex:1;min-width:0;}
.result-row .rname{font-weight:700;font-size:14px;}
.result-row .rsub{color:var(--text-faint);font-size:12.5px;font-family:var(--font-m);}
.result-row .rdesc{color:var(--text-dim);font-size:13.5px;margin-top:2px;line-height:1.4;}
.comment-hit{background:var(--surface);border-radius:12px;padding:2px 8px;font-size:11px;color:var(--text-faint);margin-top:4px;display:inline-block;}
.trending-title{font-family:var(--font-d);font-weight:600;font-size:13.5px;color:var(--text-dim);padding:4px 18px 10px;text-transform:uppercase;letter-spacing:.05em;}

/* ============ CHANNELS ============ */
.channel-card{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--border-soft);align-items:center;}
.channel-cover{
  width:52px;height:52px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);font-family:var(--font-d);font-weight:700;font-size:17px;border:1px solid var(--border-soft);
}
.channel-info{flex:1;min-width:0;}
.channel-info .cname{font-weight:700;font-size:14.5px;}
.channel-info .cdesc{color:var(--text-dim);font-size:13px;margin-top:2px;line-height:1.4;}
.channel-info .cmeta{color:var(--text-faint);font-family:var(--font-m);font-size:11.5px;margin-top:5px;}
.sub-btn{
  flex-shrink:0;padding:8px 15px;border-radius:999px;background:var(--white);color:#000;border:none;
  font-size:12.5px;font-weight:700;
}
.sub-btn.subscribed{background:var(--surface);color:var(--text-dim);border:1px solid var(--border-soft);}
.new-channel-btn{
  display:flex;align-items:center;gap:10px;margin:14px 18px;padding:13px 16px;border:1.5px dashed var(--border);
  border-radius:16px;color:var(--text-dim);font-weight:600;font-size:14px;background:none;width:calc(100% - 36px);
}
.new-channel-btn .icon{width:18px;height:18px;}

/* Channel detail */
.channel-hero{position:relative;}
.channel-hero-cover{height:130px;background:linear-gradient(135deg,var(--surface-2),var(--surface));}
.channel-hero-icon{
  width:66px;height:66px;border-radius:20px;background:var(--bg-elev);border:3px solid var(--bg);
  position:absolute;left:18px;bottom:-30px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-weight:700;font-size:22px;
}
.channel-hero-body{padding:40px 18px 10px;}
.channel-hero-body h2{font-family:var(--font-d);font-size:20px;margin:0 0 4px;}
.channel-hero-body p{color:var(--text-dim);font-size:14px;line-height:1.5;margin:0 0 10px;}
.channel-hero-meta{display:flex;align-items:center;gap:14px;}
.channel-hero-meta span{font-family:var(--font-m);font-size:12px;color:var(--text-faint);}

/* ============ PROFILE ============ */
.profile-cover{height:150px;position:relative;background:linear-gradient(150deg,#1c1c1f,#0e0e10);background-size:cover;background-position:center;}
.edit-badge{
  position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
}
.edit-badge .icon{width:15px;height:15px;}
.cover-edit{top:12px;right:12px;}
.profile-top{padding:0 18px;position:relative;}
.profile-avatar-wrap{margin-top:-38px;position:relative;width:82px;}
.profile-avatar{width:82px;height:82px;border-radius:24px;border:4px solid var(--bg);font-size:26px;}
.avatar-edit{bottom:-4px;right:-4px;width:28px;height:28px;}
.profile-actions{position:absolute;top:14px;right:18px;display:flex;gap:8px;}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;}
.profile-name{font-family:var(--font-d);font-size:20px;font-weight:700;margin:12px 0 0;}
.streak-badge{display:inline-flex;align-items:center;gap:2px;font-family:var(--font-m);font-size:13px;font-weight:600;color:var(--warn,#ffcf7d);margin-left:6px;vertical-align:middle;}
.streak-badge.at-risk{color:var(--text-faint);animation:streak-pulse 1.4s ease-in-out infinite;}
@keyframes streak-pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.profile-handle{font-family:var(--font-m);color:var(--text-faint);font-size:13px;margin-top:2px;}
.copy-link-btn{width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);flex-shrink:0;padding:0;}
.copy-link-btn:active{background:var(--surface-2);}
.copy-link-btn .icon{width:12px;height:12px;stroke-width:2.2;}
.profile-bio{font-size:14px;color:var(--text-dim);line-height:1.5;margin-top:10px;}
.profile-stats{display:flex;gap:22px;margin-top:16px;}
.stat-block .n{font-family:var(--font-m);font-weight:600;font-size:16px;color:var(--text);}
.stat-block .l{font-size:12px;color:var(--text-faint);margin-top:1px;}
.edit-profile-btn{
  margin-top:16px;width:100%;padding:11px;border-radius:14px;background:var(--surface);border:1px solid var(--border-soft);
  color:var(--text);font-weight:600;font-size:14px;
}
.activity-btn{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;}
.activity-btn .icon{width:16px;height:16px;}
.profile-tabs{display:flex;margin-top:18px;border-bottom:1px solid var(--border-soft);}
.ptab{flex:1;text-align:center;padding:13px 0;font-size:13.5px;font-weight:600;color:var(--text-faint);position:relative;}
.ptab.active{color:var(--text);}
.ptab.active::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:var(--white);border-radius:2px;}

/* ============ SETTINGS ============ */
.settings-group{margin:18px 0;}
.settings-label{padding:0 18px 8px;font-size:12px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
.settings-row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border-soft);}
.theme-picker-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.theme-picker-row::-webkit-scrollbar{display:none;}
.theme-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:4px;border-radius:14px;}
.theme-chip span:last-child{font-size:11px;color:var(--text-dim);font-weight:600;}
.theme-chip.active span:last-child{color:var(--text);}
.theme-swatch{width:44px;height:44px;border-radius:50%;border:2px solid var(--border-soft);display:block;}
.theme-chip.active .theme-swatch{border-color:var(--white);box-shadow:0 0 0 2px var(--bg), 0 0 0 3px var(--white);}
.settings-row .rt{flex:1;font-size:14.5px;}
.settings-row .rsub{font-size:12px;color:var(--text-faint);margin-top:2px;}
.switch{width:44px;height:26px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);position:relative;flex-shrink:0;}
.switch.on{background:var(--white);border-color:var(--white);}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:left .22s ease,background .22s ease;}
.switch.on .knob{left:20px;background:#000;}
.logout-btn{margin:26px 18px;padding:13px;width:calc(100% - 36px);border-radius:14px;background:var(--surface);border:1px solid var(--border-soft);color:var(--text);font-weight:700;font-size:14px;}

/* Simple form modal (edit profile / new channel) */
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12.5px;color:var(--text-faint);margin-bottom:6px;font-weight:600;}
.form-field input,.form-field textarea{
  width:100%;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:11px 13px;
  font-size:14.5px;outline:none;resize:none;
}
.form-field textarea{min-height:70px;}
.avatar-picker{
  background:var(--surface);border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);cursor:pointer;overflow:hidden;border-radius:18px;
}
.video-badge{
  position:absolute;bottom:-4px;left:-4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
}

/* ============ LIGHTBOX / TOAST ============ */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
#lightbox.show{display:flex;}
#lightbox img{max-width:100%;max-height:100%;border-radius:14px;}
#lightbox .close-lb{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;}
#toast-wrap{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:440px;pointer-events:none;}
.toast{
  background:var(--white);color:#000;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:all .28s ease;
}
.toast.show{opacity:1;transform:translateY(0);}

/* focus visibility */
button:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--white);outline-offset:2px;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important;}
}

/* ============================================================
   NOTIFICATIONS
============================================================ */
.notif-badge{
  position:absolute;top:5px;right:5px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--white);color:#000;font-family:var(--font-m);font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.notif-row{display:flex;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border-soft);position:relative;}
.notif-row.unread{background:rgba(255,255,255,.03);}
.notif-row.unread::before{content:'';position:absolute;left:6px;top:22px;width:6px;height:6px;border-radius:50%;background:var(--white);}
.notif-icon{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-dim);}
.notif-icon .icon{width:17px;height:17px;}
.notif-text{flex:1;min-width:0;font-size:14px;line-height:1.4;color:var(--text);}
.notif-text b{font-weight:700;}
.notif-time{font-family:var(--font-m);color:var(--text-faint);font-size:11.5px;margin-top:3px;}
.notif-tabs{display:flex;gap:6px;padding:12px 18px;overflow-x:auto;scrollbar-width:none;}
.notif-tabs::-webkit-scrollbar{display:none;}
.notif-clear{background:none;border:none;color:var(--text-dim);font-size:13px;font-weight:600;padding:6px 4px;}

/* ============================================================
   FEED MODE TOGGLE ("Для вас")
============================================================ */
.feed-mode-toggle{display:flex;gap:4px;margin:0 18px 12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:999px;padding:3px;}
/* Channels section has 3 tabs ("Каналы" / "🏆 Рейтинг" / "Магазин") — instead of
   forcing them into one shrinking pill row, this variant lets each tab be its
   own chip that wraps onto a second row on narrow screens, so nothing ever
   gets cramped or clipped. */
.channels-menu-wrap{padding:4px 4px 0;display:flex;flex-direction:column;gap:0;}
.channels-menu-item{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;background:none;border:none;font-size:15px;font-weight:500;color:var(--text);text-align:left;width:100%;}
.channels-menu-item:active{background:var(--surface);}
.channels-menu-item .cmi-icon{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-dim);}
.channels-menu-item .cmi-icon .icon{width:19px;height:19px;}
.channels-menu-item .cmi-chev{margin-left:auto;color:var(--text-faint);display:flex;flex-shrink:0;}
.channels-menu-item .cmi-chev .icon{width:16px;height:16px;}
.rating-list{padding:0 18px;display:flex;flex-direction:column;gap:2px;}
.rating-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.rating-row:last-child{border-bottom:none;}
.rating-rank{width:28px;text-align:center;font-family:var(--font-d);font-weight:700;font-size:15px;color:var(--text-faint);flex-shrink:0;}
.rating-rank.top{font-size:20px;}
.rating-avatar{width:42px;height:42px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden;flex-shrink:0;}
.rating-avatar img{width:100%;height:100%;object-fit:cover;}
.rating-info{flex:1;min-width:0;}
.rating-name{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rating-sub{font-family:var(--font-m);font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.rating-count{text-align:right;font-family:var(--font-d);font-weight:700;font-size:14px;flex-shrink:0;}
.rating-count span{display:block;font-family:var(--font-b);font-weight:500;font-size:10.5px;color:var(--text-faint);}
.fmt-btn{flex:1;text-align:center;padding:8px 0;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-dim);background:none;border:none;}
.fmt-btn.active{background:var(--white);color:#000;}
/* #feed-source-toggle holds 3 labels of very different length ("Все" / "Лента пользователей" / "Лента каналов").
   Equal flex:1 columns force the longest label to wrap or truncate. Instead: let each button size to its
   own content, shrink together to fit the row, and use JS (fitFeedSourceToggle) to scale the font down
   just enough that nothing ever wraps or gets cut off — same colors/shape, just correct layout math. */
#feed-source-toggle{flex-wrap:nowrap;}
#feed-source-toggle .fmt-btn{
  flex:1 1 auto;
  min-width:0;
  padding-left:5px;
  padding-right:5px;
  white-space:nowrap;
  overflow:visible;
}
#feed-source-toggle .fmt-btn[data-fsrc="all"]{flex:0 0 auto;padding-left:16px;padding-right:16px;}
.foryou-reason{font-family:var(--font-m);font-size:11px;color:var(--text-faint);padding:0 18px;margin-top:-4px;margin-bottom:2px;}
.feed-compose-bar{
  display:flex;align-items:center;gap:10px;width:calc(100% - 36px);margin:0 18px 14px;padding:10px 14px;
  background:var(--surface);border:1px solid var(--border-soft);border-radius:999px;cursor:pointer;
}
.fcb-avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);flex-shrink:0;background-size:cover;background-position:center;}
.fcb-placeholder{flex:1;text-align:left;color:var(--text-faint);font-size:14px;}
.fcb-icon{width:30px;height:30px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fcb-icon .icon{width:16px;height:16px;stroke:#000;}

/* ============================================================
   HASHTAGS
============================================================ */
.hashtag{color:var(--text);font-weight:600;}
.post-text .hashtag, .comment-bubble .hashtag{cursor:pointer;}

/* pinned marker */
.pinned-flag{display:flex;align-items:center;gap:5px;font-family:var(--font-m);font-size:11px;color:var(--text-faint);margin-bottom:4px;}
.repost-wrap{margin-bottom:0;}
.repost-label{display:flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:11.5px;color:var(--text-faint);padding:0 18px 6px;}
.repost-label .icon{width:13px;height:13px;stroke:var(--text-faint);}
.pinned-flag .icon{width:12px;height:12px;}
.post-menu-btn{margin-left:auto;background:none;border:none;color:var(--text-faint);width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.post-menu{position:absolute;right:18px;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:6px;min-width:170px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:6;display:none;}
.post-menu.show{display:block;}
.post-menu-item{padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px;}
.post-menu-item:hover{background:var(--surface-2);}
.post-menu-item.danger{color:#ff6b6b;}
.post{position:relative;}

/* ============================================================
   PROFILE ENHANCEMENTS
============================================================ */
.profile-avatar-wrap.opening .profile-avatar{animation:avatar-pop .5s cubic-bezier(.2,.9,.25,1);}
@keyframes avatar-pop{0%{transform:scale(.6);opacity:0;}60%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);}}
.profile-top.opening .profile-name,.profile-top.opening .profile-handle,.profile-top.opening .profile-bio,.profile-top.opening .profile-stats{
  animation:field-rise .45s cubic-bezier(.2,.9,.25,1) both;
}
.profile-top.opening .profile-handle{animation-delay:.05s;}
.profile-top.opening .profile-bio{animation-delay:.1s;}
.profile-top.opening .profile-stats{animation-delay:.15s;}
@keyframes field-rise{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
.name-mark{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb, var(--mc) 20%, transparent);border:1px solid color-mix(in srgb, var(--mc) 45%, transparent);vertical-align:middle;margin-left:5px;box-shadow:0 0 8px color-mix(in srgb, var(--mc) 35%, transparent);flex-shrink:0;}
.name-mark svg{stroke:var(--mc);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.profile-name{display:flex;align-items:center;}
@keyframes pulse-rec{0%,100%{opacity:1;}50%{opacity:.3;}}
.voice-msg{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;margin:8px 0;cursor:pointer;}
.voice-play-btn{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;border:none;}
.voice-play-btn svg{stroke:none;fill:currentColor;}
.voice-wave{flex:1;display:flex;align-items:center;gap:2px;height:22px;}
.voice-wave span{flex:1;background:var(--border-soft);border-radius:2px;min-width:2px;}
.voice-msg.playing .voice-wave span{background:var(--mc,var(--text-dim));}
.voice-dur{font-family:var(--font-m);font-size:12px;color:var(--text-faint);flex-shrink:0;}
.circle-msg{position:relative;width:190px;height:190px;border-radius:50%;overflow:hidden;margin:8px 0;background:var(--surface);border:1px solid var(--border-soft);}
.circle-msg video{width:100%;height:100%;object-fit:cover;}
.circle-play-btn{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:none;display:flex;align-items:center;justify-content:center;}
.circle-msg.playing .circle-play-btn{opacity:0;}
.circle-dur{position:absolute;bottom:10px;right:14px;font-family:var(--font-m);font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:999px;}
.constellation-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 18px 30px;}
.constellation-map{position:relative;margin:10px auto 0;}
.const-line{stroke-dasharray:4 6;animation:const-flow 4s linear infinite;}
@keyframes const-flow{to{stroke-dashoffset:-100;}}
.const-node{position:absolute;border-radius:50%;cursor:pointer;transition:transform .18s;}
.const-node:active{transform:scale(.92);}
.const-node.me{cursor:default;}
.profile-status{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 11px;background:var(--surface);border:1px solid var(--border-soft);border-radius:999px;font-size:12.5px;color:var(--text-dim);}
.profile-status i{width:6px;height:6px;border-radius:50%;background:#5ce596;flex-shrink:0;}
.profile-links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.profile-link-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:999px;font-size:12.5px;color:var(--text-dim);font-family:var(--font-m);}
.profile-level{display:flex;align-items:center;gap:8px;margin-top:12px;}
.level-badge{font-family:var(--font-m);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border-soft);padding:3px 9px;border-radius:999px;color:var(--text);font-weight:600;}
.xp-bar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
.xp-bar i{display:block;height:100%;background:var(--white);border-radius:3px;transition:width .5s ease;}
.achv-row{display:flex;gap:10px;padding:0 18px;margin-top:14px;overflow-x:auto;scrollbar-width:none;}
.achv-row::-webkit-scrollbar{display:none;}
.achv-badge{flex-shrink:0;width:56px;text-align:center;}
.achv-badge .em{width:44px;height:44px;border-radius:16px;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 4px;}
.achv-badge .lb{font-size:10px;color:var(--text-faint);line-height:1.2;}
.pinned-post-wrap{margin:14px 18px 0;border:1px solid var(--border-soft);border-radius:var(--r-m);overflow:hidden;}
.pinned-post-label{display:flex;align-items:center;gap:6px;padding:9px 14px 0;font-family:var(--font-m);font-size:11px;color:var(--text-faint);}
.avatar-video{position:relative;}
.avatar-video video{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.play-badge{position:absolute;bottom:0;right:0;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;}
.play-badge svg{width:8px;height:8px;fill:#fff;stroke:none;}
.stat-block{cursor:pointer;}

/* ============================================================
   COMMENTS: threads, likes, sort
============================================================ */
.comments-toolbar{display:flex;align-items:center;justify-content:space-between;padding:2px 0 10px;}
.sort-select{display:flex;gap:6px;}
.sort-chip{padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border-soft);font-size:12px;font-weight:600;color:var(--text-dim);}
.sort-chip.active{background:var(--white);color:#000;border-color:var(--white);}
.comment-actions{display:flex;align-items:center;gap:14px;margin-top:6px;}
.c-like-btn{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--text-faint);font-family:var(--font-m);font-size:12px;padding:0;}
.c-like-btn.on{color:var(--text);}
.c-like-btn .icon{width:14px;height:14px;}
.c-like-btn.on .icon{fill:var(--white);stroke:var(--white);}
.c-mini-link{background:none;border:none;color:var(--text-faint);font-size:12px;font-weight:700;padding:0;}
.comment-pinned-flag{display:flex;align-items:center;gap:4px;font-family:var(--font-m);font-size:10.5px;color:var(--text-faint);margin-bottom:3px;}
.comment-edit-input{width:100%;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;outline:none;margin-top:3px;resize:none;}
.mention-chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);padding:2px 8px 2px 2px;border-radius:999px;margin-right:4px;font-size:11.5px;}
.mention-chip .av{width:16px;height:16px;border-radius:50%;overflow:hidden;}
.mentions-bar{display:flex;gap:5px;padding:0 14px;flex-wrap:wrap;}

/* ============================================================
   CHANNEL SETTINGS / ROLES / ANALYTICS
============================================================ */
.channel-settings-btn{position:absolute;top:14px;right:18px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;}
.cs-tabs{display:flex;gap:6px;padding:12px 18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border-soft);}
.cs-tabs::-webkit-scrollbar{display:none;}
.cs-tab{flex-shrink:0;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.cs-tab.active{background:var(--white);color:#000;border-color:var(--white);}
.role-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border-soft);}
.role-row .rt{flex:1;min-width:0;}
.role-row .rname{font-weight:700;font-size:14px;}
.role-pill{display:flex;align-items:center;gap:5px;font-family:var(--font-m);font-size:11.5px;color:var(--text-dim);background:var(--surface);border:1px solid var(--border-soft);padding:5px 10px;border-radius:999px;flex-shrink:0;}
.role-select{background:var(--surface);border:1px solid var(--border-soft);color:var(--text);font-size:12px;border-radius:999px;padding:6px 8px;font-family:var(--font-m);}
.role-remove-btn{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-faint);}
.role-legend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;}
.role-legend span{font-family:var(--font-m);font-size:11px;background:var(--surface);border:1px solid var(--border-soft);padding:4px 9px;border-radius:999px;color:var(--text-dim);}
.log-row{padding:11px 18px;border-bottom:1px solid var(--border-soft);font-size:13px;color:var(--text-dim);line-height:1.5;}
.log-row .lt{color:var(--text-faint);font-family:var(--font-m);font-size:11px;display:block;margin-top:2px;}
.danger-btn{margin:20px 18px;padding:13px;width:calc(100% - 36px);border-radius:14px;background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.3);color:#ff6b6b;font-weight:700;font-size:14px;}

.period-row{display:flex;gap:6px;padding:14px 18px 6px;overflow-x:auto;scrollbar-width:none;}
.period-row::-webkit-scrollbar{display:none;}
.period-chip{flex-shrink:0;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.period-chip.active{background:var(--white);color:#000;border-color:var(--white);}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px;}
.stat-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-m);padding:14px;}
.stat-card .v{font-family:var(--font-d);font-size:21px;font-weight:700;}
.stat-card .l{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.stat-card .d{font-family:var(--font-m);font-size:11px;margin-top:6px;}
.stat-card .d.up{color:#5ce596;}
.stat-card .d.down{color:#ff8080;}
.chart-card{margin:6px 18px 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-m);padding:16px;}
.chart-card h5{margin:0 0 12px;font-family:var(--font-d);font-size:13.5px;font-weight:600;color:var(--text-dim);}
.chart-card svg{display:block;width:100%;height:auto;}
.top-post-row{display:flex;gap:10px;padding:11px 18px;border-bottom:1px solid var(--border-soft);align-items:center;}
.top-post-row .rank{font-family:var(--font-m);color:var(--text-faint);font-size:13px;width:18px;flex-shrink:0;}
.top-post-row .txt{flex:1;min-width:0;font-size:13px;color:var(--text);line-height:1.4;}
.top-post-row .n{font-family:var(--font-m);font-size:11.5px;color:var(--text-faint);margin-top:3px;}

/* ============================================================
   SKELETON LOADERS
============================================================ */
@keyframes skel-pulse{0%,100%{opacity:.5;}50%{opacity:.9;}}
.skel{background:var(--surface-2);border-radius:8px;animation:skel-pulse 1.3s ease-in-out infinite;}
.skel-post{padding:16px 18px;border-bottom:1px solid var(--border-soft);display:flex;gap:11px;}
.skel-post .skel-av{width:40px;height:40px;border-radius:50%;flex-shrink:0;}
.skel-post .skel-lines{flex:1;}
.skel-line{height:11px;border-radius:6px;margin-bottom:8px;}

/* ============================================================
   DRAG & DROP
============================================================ */
.composer-textarea.dragover, .sheet-body.dragover{outline:2px dashed var(--text-dim);outline-offset:-4px;border-radius:14px;}
.drop-hint{text-align:center;padding:10px;color:var(--text-faint);font-size:12.5px;border:1.5px dashed var(--border);border-radius:12px;margin-top:10px;}

/* ============================================================
   OFFLINE BANNER
============================================================ */
.offline-banner{
  display:none;align-items:center;gap:8px;justify-content:center;padding:8px 12px;background:var(--surface);
  border-bottom:1px solid var(--border-soft);font-family:var(--font-m);font-size:11.5px;color:var(--text-dim);
}
.offline-banner.show{display:flex;}
.offline-banner i{width:6px;height:6px;border-radius:50%;background:#ff8080;flex-shrink:0;}

/* draft indicator */
.draft-flag{font-family:var(--font-m);font-size:11px;color:var(--text-faint);margin-left:8px;}

/* ============================================================
   RESPONSIVE: tablet / desktop
============================================================ */
@media (min-width:720px){
  #app{max-width:600px;box-shadow:0 0 100px rgba(255,255,255,.05);}
  #scroll-progress,.bottom-nav{max-width:600px;}
  .stat-grid{grid-template-columns:1fr 1fr 1fr;}
}
@media (min-width:1080px){
  body{display:flex;justify-content:center;}
  #app{max-width:640px;margin-top:0;}
}

/* ============================================================
   MENTIONS in comments/posts
============================================================ */
.mention-tag{color:#8fb4ff;font-weight:600;}

/* ============================================================
   MENTLIS COINS — pill, animation, transactions
============================================================ */
.coin-pill{
  display:flex;align-items:center;gap:5px;padding:7px 12px 7px 8px;border-radius:999px;
  background:linear-gradient(135deg, rgba(255,196,64,.14), rgba(255,140,20,.06));
  border:1px solid rgba(255,196,64,.28);color:#ffd685;font-family:var(--font-m);font-size:12.5px;font-weight:700;
  flex-shrink:0;
}
.coin-ico{font-size:14px;line-height:1;}
.coin-fly{
  position:fixed;z-index:400;font-family:var(--font-m);font-weight:800;font-size:15px;color:#ffd685;
  pointer-events:none;display:flex;align-items:center;gap:4px;
  text-shadow:0 2px 10px rgba(255,180,40,.5);
  animation:coin-rise 1.1s cubic-bezier(.2,.9,.25,1) forwards;
}
@keyframes coin-rise{
  0%{opacity:0;transform:translateY(6px) scale(.8);}
  15%{opacity:1;transform:translateY(-4px) scale(1.08);}
  75%{opacity:1;transform:translateY(-34px) scale(1);}
  100%{opacity:0;transform:translateY(-46px) scale(.95);}
}
.coin-balance-pop{animation:coin-pop .4s ease;}
@keyframes coin-pop{0%{transform:scale(1);}40%{transform:scale(1.28);color:#fff;}100%{transform:scale(1);}}
.coin-sheet-balance{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 18px 18px;text-align:center;flex-direction:column;}
.coin-sheet-balance .big{font-family:var(--font-d);font-size:34px;font-weight:700;display:flex;align-items:center;gap:8px;}
.coin-sheet-balance .lbl{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
.quest-card{margin:0 18px 12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r-m);padding:13px 14px;}
.quest-card.done{border-color:rgba(255,196,64,.4);background:linear-gradient(135deg, rgba(255,196,64,.08), transparent);}
.quest-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.quest-title{font-size:13.5px;font-weight:600;}
.quest-reward{font-family:var(--font-m);font-size:11.5px;color:#ffd685;display:flex;align-items:center;gap:3px;flex-shrink:0;}
.quest-bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
.quest-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#ffb347,#ffd685);transition:width .5s ease;}
.quest-sub{font-family:var(--font-m);font-size:11px;color:var(--text-faint);margin-top:5px;}
.coin-log-row{display:flex;align-items:center;gap:11px;padding:10px 18px;border-bottom:1px solid var(--border-soft);}
.coin-log-row .cli{width:34px;height:34px;border-radius:50%;background:rgba(255,196,64,.1);border:1px solid rgba(255,196,64,.25);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.coin-log-row .clt{flex:1;font-size:13px;color:var(--text);}
.coin-log-row .cla{font-family:var(--font-m);font-weight:700;font-size:13px;color:#5ce596;flex-shrink:0;}
.coin-log-row .clt small{display:block;font-family:var(--font-m);color:var(--text-faint);font-size:11px;margin-top:2px;}

/* ============================================================
   FRAME SHOP
============================================================ */
.shop-hero{padding:16px 18px 4px;}
.shop-preview{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 18px 20px;}
.shop-preview-avatar{width:104px;height:104px;position:relative;}
.shop-preview-avatar .avatar{width:100%;height:100%;font-size:36px;}
.shop-preview-name{font-family:var(--font-m);font-size:12px;color:var(--text-faint);}
.shop-cat-row{display:flex;gap:7px;padding:2px 18px 14px;overflow-x:auto;scrollbar-width:none;}
.shop-cat-row::-webkit-scrollbar{display:none;}
.shop-type-row{display:flex;gap:8px;padding:14px 18px 4px;flex-wrap:wrap;row-gap:8px;}
.shop-type-tab{flex:0 0 auto;min-width:calc(50% - 4px);display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;border-radius:14px;background:var(--surface);border:1px solid var(--border-soft);font-size:13px;font-weight:700;color:var(--text-dim);}
.shop-type-tab.active{background:var(--white);color:#000;border-color:var(--white);}
.shop-cat-chip{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;color:var(--text-dim);display:flex;align-items:center;gap:5px;}
.shop-cat-chip.active{background:var(--white);color:#000;border-color:var(--white);}
.frame-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 24px;}
.frame-card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:18px;padding:16px 12px 13px;
  display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden;
  transition:transform .18s ease, border-color .18s ease;
}
.frame-card:active{transform:scale(.97);}
.frame-card.equipped{border-color:#ffd685;box-shadow:0 0 0 1px #ffd685 inset;}
.frame-card .fc-rarity-tag{
  position:absolute;top:9px;left:9px;font-family:var(--font-m);font-size:9.5px;font-weight:700;letter-spacing:.03em;
  padding:3px 7px;border-radius:999px;text-transform:uppercase;
}
.frame-card .fc-new-badge{position:absolute;top:9px;right:9px;font-family:var(--font-m);font-size:9px;font-weight:800;color:#5ce596;background:rgba(92,229,150,.12);border:1px solid rgba(92,229,150,.3);padding:3px 6px;border-radius:999px;}
.fc-avatar{width:72px;height:72px;position:relative;margin-top:6px;}
.fc-avatar .avatar{width:100%;height:100%;font-size:24px;}
.fc-name{font-size:12.5px;font-weight:700;text-align:center;line-height:1.25;}
.fc-price{font-family:var(--font-m);font-size:12px;color:#ffd685;display:flex;align-items:center;gap:4px;font-weight:700;}
.fc-btn{width:100%;padding:8px 0;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border-soft);background:var(--surface-2);color:var(--text);margin-top:2px;}
.fc-btn.primary{background:var(--white);color:#000;border-color:var(--white);}
.fc-btn.equipped-btn{background:rgba(255,214,133,.12);border-color:rgba(255,214,133,.4);color:#ffd685;}
.fc-btn.owned-remove{background:none;color:var(--text-faint);}

/* rarity color themes */
.rarity-common{color:#b7bdc6;background:rgba(183,189,198,.12);}
.rarity-rare{color:#7fd0ff;background:rgba(127,208,255,.14);}
.rarity-epic{color:#c896ff;background:rgba(200,150,255,.14);}
.rarity-legendary{color:#ffd685;background:rgba(255,214,133,.16);}
.rarity-seasonal{color:#7fffc4;background:rgba(127,255,196,.14);}
.rarity-limited{color:#ff9bb0;background:rgba(255,155,176,.14);}

/* frame rings — CSS-generated, no image assets needed */
.avatar-frame{position:absolute;inset:-5px;border-radius:50%;pointer-events:none;}
.frame-ring-common{box-shadow:0 0 0 3px #6c7480;}
.frame-ring-silver{box-shadow:0 0 0 3px #c9ced6, 0 0 14px 1px rgba(201,206,214,.5);}
.frame-ring-ocean{background:conic-gradient(from 0deg,#4fc3ff,#7fe3ff,#4fc3ff);border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));box-shadow:0 0 16px 1px rgba(79,195,255,.55);animation:frame-spin 5.5s linear infinite;}
.frame-ring-violet{background:conic-gradient(from 0deg,#a869ff,#e19dff,#a869ff);border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));box-shadow:0 0 16px 1px rgba(168,105,255,.55);animation:frame-spin 5s linear infinite reverse;}
.frame-ring-inferno{background:conic-gradient(from 0deg,#ff5c33,#ffb23d,#ff5c33);border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));box-shadow:0 0 18px 2px rgba(255,110,50,.6);animation:frame-spin 4s linear infinite;}
.frame-ring-aurum{background:conic-gradient(from 0deg,#ffd685,#fff3cf,#ffb347,#ffd685);border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));box-shadow:0 0 20px 2px rgba(255,214,133,.65);animation:frame-spin 5s linear infinite;}
.frame-ring-nebula{background:conic-gradient(from 0deg,#7fe3ff,#c896ff,#ff9bd8,#7fe3ff);border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));box-shadow:0 0 22px 3px rgba(200,150,255,.6);animation:frame-spin 6s linear infinite reverse;}

<script>
/* ============================================================
   MENTLIS SHARED DATA LAYER (MentlisDB)
   IndexedDB-backed store shared between the Mentlis app and the
   admin panel. Both documents include this exact block so they
   read/write the same origin-scoped database. A BroadcastChannel
   is used so open tabs/windows pick up changes from each other
   immediately (e.g. an admin ban shows up in Mentlis right away).
============================================================ */
window.MentlisDB = (function(){
  "use strict";
  const DB_NAME = 'mentlis_db';
  const DB_VERSION = 1;
  const STORE = 'kv';
  let dbPromise = null;
  let bc = null;
  try{ bc = ('BroadcastChannel' in window) ? new BroadcastChannel('mentlis_sync') : null; }catch(err){ bc = null; }
  const listeners = {};

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      if(!('indexedDB' in window)){ reject(new Error('IndexedDB unsupported')); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {keyPath:'key'});
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return dbPromise;
  }

  async function idbGet(key){
    try{
      const db = await openDB();
      return await new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE, 'readonly');
        const rq = tx.objectStore(STORE).get(key);
        rq.onsuccess = ()=> resolve(rq.result ? rq.result.value : undefined);
        rq.onerror = ()=> reject(rq.error);
      });
    }catch(err){ return undefined; }
  }
  async function idbSet(key, value){
    try{
      const db = await openDB();
      await new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put({key, value});
        tx.oncomplete = ()=> resolve();
        tx.onerror = ()=> reject(tx.error);
      });
      return true;
    }catch(err){ return false; }
  }
  async function idbGetAllKeys(prefix){
    try{
      const db = await openDB();
      return await new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE, 'readonly');
        const rq = tx.objectStore(STORE).getAllKeys();
        rq.onsuccess = ()=> resolve((rq.result||[]).filter(k=>!prefix || String(k).indexOf(prefix)===0));
        rq.onerror = ()=> reject(rq.error);
      });
    }catch(err){ return []; }
  }

  // localStorage mirror: keeps working even if IndexedDB is unavailable
  // (private browsing, old browsers) and gives synchronous first paint.
  function lsGet(key){
    try{ const raw = localStorage.getItem('mdb_'+key); return raw ? JSON.parse(raw) : undefined; }catch(err){ return undefined; }
  }
  function lsSet(key, value){
    try{ localStorage.setItem('mdb_'+key, JSON.stringify(value)); }catch(err){ /* quota or unavailable */ }
  }

  async function get(key, fallback){
    const idbVal = await idbGet(key);
    if(idbVal !== undefined) return idbVal;
    const lsVal = lsGet(key);
    if(lsVal !== undefined) return lsVal;
    return fallback;
  }
  function getSync(key, fallback){
    const v = lsGet(key);
    return v===undefined ? fallback : v;
  }
  async function set(key, value, opts){
    lsSet(key, value);
    await idbSet(key, value);
    if(bc && !(opts && opts.silent)){
      try{ bc.postMessage({key, value, ts:Date.now()}); }catch(err){}
    }
    return true;
  }
  function onChange(key, cb){
    (listeners[key] = listeners[key]||[]).push(cb);
  }
  if(bc){
    bc.onmessage = (e)=>{
      const msg = e.data;
      if(!msg || !msg.key) return;
      lsSet(msg.key, msg.value);
      (listeners[msg.key]||[]).forEach(cb=>{ try{ cb(msg.value); }catch(err){} });
      (listeners['*']||[]).forEach(cb=>{ try{ cb(msg.key, msg.value); }catch(err){} });
    };
  }
  window.addEventListener('storage', (e)=>{
    if(!e.key || e.key.indexOf('mdb_')!==0) return;
    const key = e.key.slice(4);
    let value; try{ value = e.newValue ? JSON.parse(e.newValue) : undefined; }catch(err){ return; }
    (listeners[key]||[]).forEach(cb=>{ try{ cb(value); }catch(err){} });
    (listeners['*']||[]).forEach(cb=>{ try{ cb(key, value); }catch(err){} });
  });

  return { get, getSync, set, onChange, idbGetAllKeys };
})();

/* Moscow time (UTC+3, no DST since 2014) is used as Mentlis's canonical clock,
   so "just now" / "5m ago" / publish timestamps are all consistent regardless
   of the visitor's own device timezone. */
const MSK_OFFSET_MIN = 180;
const MENTLIS_LAUNCH_MS = new Date('2026-01-01T00:00:00Z').getTime();
function nowMSK(){
  const utc = Date.now();
  return utc; // we keep working timestamps in UTC ms and only shift for *display*
}
function toMSKDate(ts){
  const d = new Date(ts);
  const utcMs = d.getTime() + d.getTimezoneOffset()*60000;
  return new Date(utcMs + MSK_OFFSET_MIN*60000);
}
/* Computes "just now / Nm / Nh / Nd" style relative time from an absolute
   timestamp (ms since epoch). This replaces the old static `mins` counter,
   which was frozen at whatever value a post was created with and never
   actually advanced — so everything looked like it happened "just now"
   forever, and old demo posts never aged past their seeded value either. */
function fmtTime(createdAt){
  if(typeof createdAt !== 'number'){
    // legacy fallback: some seed data may still pass a plain minute count
    const mins = createdAt||0;
    if(mins<1) return 'сейчас';
    if(mins<60) return mins+'м';
    const h=Math.floor(mins/60);
    if(h<24) return h+'ч';
    const d=Math.floor(h/24);
    if(d<7) return d+'д';
    return Math.floor(d/7)+'нед';
  }
  const diffMs = Date.now() - createdAt;
  // Guards against corrupted/pre-migration timestamps slipping past sanitizeAllTimestamps:
  // anything before Mentlis's own launch, or in the future, shows a real date instead of
  // a relative label that would otherwise read as nonsense like "2952 weeks ago".
  if(diffMs < 0 || createdAt < MENTLIS_LAUNCH_MS) return fmtDateTimeMSK(createdAt) || 'сейчас';
  const mins = Math.floor(diffMs/60000);
  if(mins<1) return 'сейчас';
  if(mins<60) return mins+'м';
  const h=Math.floor(mins/60);
  if(h<24) return h+'ч';
  const d=Math.floor(h/24);
  if(d<7) return d+'д';
  return Math.floor(d/7)+'нед';
}
/* Full absolute timestamp in Moscow time, e.g. "29 июля, 14:32 МСК" — used
   wherever the exact publish moment matters rather than a relative label. */
const MSK_MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function fmtDateTimeMSK(createdAt){
  if(typeof createdAt !== 'number') return '';
  const d = toMSKDate(createdAt);
  const hh = String(d.getUTCHours()).padStart(2,'0');
  const mm = String(d.getUTCMinutes()).padStart(2,'0');
  return d.getUTCDate()+' '+MSK_MONTHS[d.getUTCMonth()]+', '+hh+':'+mm+' МСК';
}
function fmtNum(n){
  if(n>=1000000) return (n/1000000).toFixed(1).replace('.0','')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'K';
  return String(n);
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
/* Copies text to the clipboard with a fallback for contexts where the
   modern Clipboard API isn't available (e.g. non-HTTPS or older webviews). */
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=>showToast('Ссылка скопирована'),
      ()=>copyToClipboardFallback(text)
    );
  } else {
    copyToClipboardFallback(text);
  }
}
function copyToClipboardFallback(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Ссылка скопирована');
  }catch(err){ showToast('Не удалось скопировать ссылку'); }
}

/* ============================================================
   IMAGE COMPRESSION (client-side, canvas-based)
============================================================ */
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.85;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>resolve(reader.result); // fallback: original
      img.onload = ()=>{
        let {width,height} = img;
        if(width>maxDim || height>maxDim){
          const scale = maxDim/Math.max(width,height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ resolve(reader.result); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
/* Center-crops any uploaded photo to a square before it's masked into a circle avatar,
   so the avatar is always perfectly round no matter the source image's aspect ratio. */
function cropImageToSquare(file, size, quality){
  size = size || 500; quality = quality || 0.88;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>resolve(reader.result);
      img.onload = ()=>{
        const srcSize = Math.min(img.width, img.height);
        const sx = (img.width - srcSize)/2;
        const sy = (img.height - srcSize)/2;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, size, size);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ resolve(reader.result); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   SMART POST TRANSLATION
   Detects when a post is likely written in a language other than
   Russian (simple script/alphabet heuristic — no server calls),
   then offers to translate it using the browser's built-in
   Translator API (Chrome/Edge 2025+, runs fully on-device). If the
   API isn't available in the visitor's browser, the button quietly
   explains that instead of pretending to translate.
============================================================ */
function detectTextLanguage(text){
  const clean = (text||'').replace(/[#@][\wа-яА-ЯёЁ.]+/g,'').replace(/[^\p{L}]/gu,'');
  if(clean.length < 8) return null; // too short to guess reliably
  const cyrillic = (clean.match(/[а-яА-ЯёЁ]/g)||[]).length;
  const latin = (clean.match(/[a-zA-Z]/g)||[]).length;
  const total = cyrillic + latin;
  if(total < 8) return null; // mostly non-alphabetic (emoji, CJK, etc.) — skip guessing
  if(cyrillic > latin * 3) return 'ru';
  if(latin > cyrillic * 3) return 'en';
  return null; // too mixed to be confident
}
function shouldOfferTranslation(text){
  return detectTextLanguage(text) === 'en';
}
const translatedPosts = {}; // postId -> translated string, cached per session
async function translatePostText(postId, btn){
  const post = postById(postId);
  if(!post || !post.text) return;
  const textEl = document.getElementById('pt-'+postId);
  if(!textEl) return;

  // toggle back to original if already translated
  if(translatedPosts[postId] && btn.dataset.state==='translated'){
    textEl.innerHTML = richText(post.text);
    btn.dataset.state = '';
    btn.innerHTML = svg('translate',13)+'Перевести';
    return;
  }
  if(translatedPosts[postId]){
    textEl.innerHTML = richText(translatedPosts[postId]);
    btn.dataset.state = 'translated';
    btn.innerHTML = svg('translate',13)+'Показать оригинал';
    return;
  }

  if(!('Translator' in window)){
    showToast('Перевод недоступен: браузер не поддерживает встроенный переводчик (нужен Chrome/Edge)');
    return;
  }
  btn.disabled = true;
  const originalLabel = btn.innerHTML;
  btn.innerHTML = svg('translate',13)+'Перевожу…';
  try{
    const availability = await window.Translator.availability({sourceLanguage:'en', targetLanguage:'ru'});
    if(availability === 'unavailable'){
      showToast('Перевод для этой языковой пары недоступен в вашем браузере');
      btn.innerHTML = originalLabel; btn.disabled = false;
      return;
    }
    const translator = await window.Translator.create({sourceLanguage:'en', targetLanguage:'ru'});
    const result = await translator.translate(post.text);
    translatedPosts[postId] = result;
    textEl.innerHTML = richText(result);
    btn.dataset.state = 'translated';
    btn.innerHTML = svg('translate',13)+'Показать оригинал';
  }catch(err){
    showToast('Не удалось перевести публикацию');
    btn.innerHTML = originalLabel;
  }
  btn.disabled = false;
}

function richText(text){
  // escape then linkify hashtags and @mentions safely (esc first, then wrap word-token matches)
  const escaped = esc(text||'');
  let out = escaped.replace(/(^|\s)(#[\wа-яА-ЯёЁ]+)/g, function(m,pre,tag){
    return pre+'<span class="hashtag" data-hashtag="'+esc(tag.slice(1).toLowerCase())+'">'+tag+'</span>';
  });
  out = out.replace(/(^|\s)(@[\w.]+)/g, function(m,pre,tag){
    return pre+'<span class="mention-tag" data-mention="'+esc(tag.slice(1).toLowerCase())+'">'+tag+'</span>';
  });
  return out;
}

function showToast(msg){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  wrap.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 2200);
}

function pollHTML(post){
  const p = post.poll;
  const total = p.options.reduce((s,o)=>s+o.votes,0) || 1;
  let html = '<div class="poll" data-post="'+post.id+'">';
  p.options.forEach((o,i)=>{
    const pct = p.voted ? Math.round(o.votes/total*100) : 0;
    const isChoice = p.voted && p.choice===i;
    html += '<div class="poll-opt '+(isChoice?'voted-choice':'')+'" data-opt="'+i+'" data-post="'+post.id+'">'
      + '<div class="poll-opt-fill" style="width:'+(p.voted?pct:0)+'%;"></div>'
      + '<div class="poll-opt-label"><span>'+esc(o.text)+'</span>'+(p.voted?'<span class="poll-opt-pct">'+pct+'%</span>':'')+'</div>'
      + '</div>';
  });
  html += '<div class="poll-meta">'+fmtNum(total)+' голосов'+(p.voted?'':' · нажмите, чтобы проголосовать')+'</div></div>';
  return html;
}

function voiceHTML(post){
  if(post.type!=='voice' || !post.voice) return '';
  const bars = Array.from({length:26}).map((_,i)=>Math.round(6+Math.abs(Math.sin(i*1.7))*14)).join(',').split(',');
  return '<div class="voice-msg" data-voice-play="'+post.id+'">'
    + '<button class="voice-play-btn">'+svg('play',15)+'</button>'
    + '<div class="voice-wave">'+bars.map(h=>'<span style="height:'+h+'px;"></span>').join('')+'</div>'
    + '<span class="voice-dur">'+post.voice.duration+'с</span>'
    + '<audio id="voice-'+post.id+'" src="'+post.voice.src+'" preload="none"></audio>'
    + '</div>';
}
function circleHTML(post){
  if(post.type!=='circle' || !post.circle) return '';
  return '<div class="circle-msg" data-circle-play="'+post.id+'">'
    + '<video id="circle-'+post.id+'" src="'+post.circle.src+'" muted loop playsinline></video>'
    + '<button class="circle-play-btn">'+svg('play',20)+'</button>'
    + '<span class="circle-dur">'+post.circle.duration+'с</span>'
    + '</div>';
}

/* Shrinks the 3-tab row's font-size just enough that every label fits on one line,
   with no wrapping and no truncation, regardless of screen width. */
function fitFeedSourceToggle(){
  const wrap = document.getElementById('feed-source-toggle');
  if(!wrap || wrap.style.display==='none') return;
  const btns = wrap.querySelectorAll('.fmt-btn');
  if(!btns.length) return;
  let size = 13; // starting font-size in px, matches .fmt-btn default
  const minSize = 9.5;
  btns.forEach(b=>{ b.style.fontSize = size+'px'; });
  // shrink until the row's natural content width fits the wrapper, or we hit the floor
  let guard = 0;
  while(wrap.scrollWidth > wrap.clientWidth + 1 && size > minSize && guard < 20){
    size -= 0.5;
    btns.forEach(b=>{ b.style.fontSize = size+'px'; });
    guard++;
  }
}
