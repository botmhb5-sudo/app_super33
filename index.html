/* ------------ recommendation scoring for "Для вас" ------------ */
function scorePost(post){
  let score = 0;
  score += (INTEREST.channels[post.channelId]||0) * 3;
  score += (INTEREST.authors[post.authorId]||0) * 2;
  (extractHashtags(post.text)||[]).forEach(t=>{ score += (INTEREST.tags[t]||0) * 2; });
  score += Math.log(1+post.resonance) * 0.8;
  score += Math.log(1+(post.views||1)) * 0.3;
  score -= post.mins * 0.01; // slight recency decay
  return score;
}
function forYouReason(post){
  if(INTEREST.authors[post.authorId]) return 'Потому что вы часто взаимодействуете с '+userById(post.authorId).name;
  if(post.channelId && INTEREST.channels[post.channelId]) return 'Похоже на то, что вам нравится в «'+channelById(post.channelId).name+'»';
  const tags = extractHashtags(post.text)||[];
  const hot = tags.find(t=>INTEREST.tags[t]);
  if(hot) return 'По вашему интересу к '+hot;
  return 'Популярно сейчас';
}
function computeForYouPosts(){
  return POSTS.slice().map(p=>({p,score:scorePost(p)})).sort((a,b)=>b.score-a.score).map(x=>x.p);
}
function updateComposeBar(){
  const av = document.getElementById('fcb-avatar');
  if(av) av.style.backgroundImage = ME.avatar ? 'url('+ME.avatar+')' : 'none';
  const ph = document.getElementById('fcb-placeholder');
  if(ph) ph.textContent = 'Что нового, '+ME.name.split(' ')[0]+'?';
}
function renderFeed(){
  renderFeedModeToggle();
  renderFeedSourceToggle();
  updateComposeBar();
  const list = document.getElementById('feed-list');
  const reasonEl = document.getElementById('foryou-reason');
  let posts;
  if(UI.feedMode==='foryou'){
    posts = computeForYouPosts();
    if(posts.length) reasonEl.textContent = forYouReason(posts[0]);
    reasonEl.style.display = posts.length ? '' : 'none';
  } else {
    posts = POSTS.slice().sort((a,b)=>a.mins-b.mins);
    if(UI.feedSource==='users') posts = posts.filter(p=>!p.channelId);
    else if(UI.feedSource==='channels') posts = posts.filter(p=>p.channelId);
    if(UI.feedChannelFilter) posts = posts.filter(p=>p.channelId===UI.feedChannelFilter);
    reasonEl.style.display='none';
  }
  if(!posts.length){
    list.innerHTML = emptyState('grid','Пока тихо','Здесь появятся публикации, когда вы подпишетесь на каналы или кто-то опубликует пост.');
    return;
  }
  list.innerHTML = posts.map(p=>postCardHTML(p)).join('');
}

function frameCardHTML(f){
  const owned = ME.ownedFrames.includes(f.id);
  const equipped = ME.equippedFrame===f.id;
  const r = RARITY[f.rarity];
  let btn;
  if(equipped) btn = '<button class="fc-btn equipped-btn" data-unequip="'+f.id+'">✓ Надета · Снять</button>';
  else if(owned) btn = '<button class="fc-btn primary" data-equip="'+f.id+'">Надеть</button>';
  else if(f.achievementOnly) btn = '<button class="fc-btn" disabled>За достижение</button>';
  else btn = '<button class="fc-btn primary" data-buy="'+f.id+'">Купить</button>';
  return '<div class="frame-card '+(equipped?'equipped':'')+'" data-preview="'+f.id+'">'
    + '<span class="fc-rarity-tag rarity-'+f.rarity+'">'+r.label+'</span>'
    + (f.isNew ? '<span class="fc-new-badge">NEW</span>' : '')
    + '<div class="fc-avatar">'+avatarHTML(ME,72,false,f.id)+'</div>'
    + '<div class="fc-name">'+esc(f.name)+(f.animated?' <span style="opacity:.5;">✦</span>':'')+'</div>'
    + (owned ? '' : '<div class="fc-price">'+(f.price>0 ? '🪙 '+fmtNum(f.price) : (f.achievementOnly?'🔒':'Бесплатно'))+'</div>')
    + (f.limited && f.stock ? '<div style="font-family:var(--font-m);font-size:10px;color:var(--text-faint);">'+f.stock+'</div>' : '')
    + btn
  + '</div>';
}
function wireFrameCards(){
  const grid = document.getElementById('frame-grid');
  grid.querySelectorAll('[data-preview]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-buy],[data-equip],[data-unequip]')) return;
      const id = card.dataset.preview;
      UI.shopPreviewFrame = (UI.shopPreviewFrame===id) ? (ME.equippedFrame||null) : id;
      renderShop();
    });
  });
  grid.querySelectorAll('[data-buy]').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const f = frameById(btn.dataset.buy);
    if(ME.coins < f.price){ showToast('Недостаточно Mentlis Coins'); return; }
    if(!confirm('Купить рамку «'+f.name+'» за '+fmtNum(f.price)+' 🪙?')) return;
    ME.coins -= f.price;
    ME.ownedFrames.push(f.id);
    ME.equippedFrame = f.id;
    UI.shopPreviewFrame = f.id;
    logCoin(-f.price, 'Покупка рамки «'+f.name+'»');
    renderCoinBalance(true);
    showToast('Рамка «'+f.name+'» куплена и надета');
    renderShop();
    if(UI.view==='profile') renderProfile();
  }));
  grid.querySelectorAll('[data-equip]').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const f = frameById(btn.dataset.equip);
    ME.equippedFrame = f.id;
    UI.shopPreviewFrame = f.id;
    showToast('Рамка «'+f.name+'» надета');
    renderShop();
    if(UI.view==='profile') renderProfile();
  }));
  grid.querySelectorAll('[data-unequip]').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    ME.equippedFrame = null;
    UI.shopPreviewFrame = null;
    showToast('Рамка снята');
    renderShop();
    if(UI.view==='profile') renderProfile();
  }));
}

function unlockAchievement(key){
  if(ME.achievements.includes(key)) return;
  const a = ACHIEVEMENTS[key];
  if(!a) return;
  ME.achievements.push(key);
  showToast('Достижение открыто: '+a.icon+' '+a.name);
  if(a.reward){
    if(a.reward.coins){ ME.coins += a.reward.coins; logCoin(a.reward.coins, 'Достижение «'+a.name+'»'); renderCoinBalance(true); spawnCoinFly(a.reward.coins, document.getElementById('btn-coins')); }
    if(a.reward.frameId && !ME.ownedFrames.includes(a.reward.frameId)){
      ME.ownedFrames.push(a.reward.frameId);
      const fr = frameById(a.reward.frameId);
      setTimeout(()=>showToast('Открыта новая рамка: '+(fr?fr.name:'')), 700);
    }
  }
  if(UI.view==='profile') renderProfile();
}

function myRoleIn(channel){ return channel.team ? channel.team['u0'] : null; }
function canManage(channel){ const r = myRoleIn(channel); return !!(r && ROLES[r].rank>=3); } // admin+
function canModerate(channel){ const r = myRoleIn(channel); return !!(r && ROLES[r].rank>=1); } // moderator+: avatar/cover/posts/settings
function isChannelOwner(channel){ const r = myRoleIn(channel); return r==='owner'; }
function renderChannelDetail(id){
  const c = channelById(id);
  const view = document.getElementById('view-channel-detail');
  const posts = POSTS.slice().sort((a,b)=>a.mins-b.mins).filter(p=>p.channelId===id);
  const pinned = posts.find(p=>p.pinned);
  const rest = pinned ? posts.filter(p=>p.id!==pinned.id) : posts;
  const manage = canModerate(c);
  view.innerHTML =
    '<div class="channel-hero">'
      + '<div class="channel-hero-cover" style="'+(c.cover?'background-image:url('+c.cover+');background-size:cover;background-position:center;':'')+'"></div>'
      + '<div class="channel-hero-icon">'+(c.avatar?'<img src="'+c.avatar+'" style="width:100%;height:100%;object-fit:cover;border-radius:20px;">':esc(initials(c.name)))+'</div>'
    + '</div>'
    + '<div class="header-row" style="position:absolute;top:0;left:0;right:0;padding-top:14px;">'
      + '<button class="back-btn" id="cd-back">'+svg('chevL',18)+'</button>'
      + (manage ? '<button class="channel-settings-btn" id="cd-settings" title="Настройки канала" style="margin-left:auto;">'+svg('settings',16)+'</button>' : '')
    + '</div>'
    + '<div class="channel-hero-body">'
      + '<h2>'+esc(c.name)+'</h2>'
      + '<p>'+esc(c.desc)+'</p>'
      + '<div class="channel-hero-meta"><span>'+fmtNum(c.members)+' участников</span><span>'+posts.length+' публикаций</span>'+(c.link?'<span style="display:inline-flex;align-items:center;gap:5px;">mentlis.channels/'+esc(c.link)+'<button class="copy-link-btn" id="cd-copy-link" title="Скопировать ссылку на канал">'+svg('link',11)+'</button></span>':'')+'</div>'
      + '<div style="display:flex;gap:10px;margin-top:14px;">'
        + '<button class="sub-btn '+(c.subscribed?'subscribed':'')+'" id="cd-sub" style="flex:1;">'+(c.subscribed?'Вы подписаны':'Подписаться')+'</button>'
        + '<button class="icon-btn" id="cd-post" style="width:44px;height:44px;flex-shrink:0;">'+svg('plus',18)+'</button>'
        + (manage ? '<button class="icon-btn" id="cd-analytics" style="width:44px;height:44px;flex-shrink:0;" title="Статистика">'+svg('chart',18)+'</button>' : '')
      + '</div>'
    + '</div>'
    + '<div class="feed" id="cd-feed" style="margin-top:6px;">'
      + (pinned ? postCardHTML(pinned,{hideChannel:true}) : '')
      + (rest.length ? rest.map(p=>postCardHTML(p,{hideChannel:true})).join('') : (pinned?'':emptyState('grid','Пока нет публикаций','Будьте первым, кто опубликует что-то в этом канале.')))
    + '</div>';

  view.querySelector('#cd-back').addEventListener('click', ()=>{
    switchView(UI.channelDetailReturnTo || 'channels-list');
  });
  view.querySelector('#cd-sub').addEventListener('click', ()=>{ toggleSubscribe(id); renderChannelDetail(id); });
  view.querySelector('#cd-post').addEventListener('click', ()=>openComposer(id));
  const settingsBtn = view.querySelector('#cd-settings');
  if(settingsBtn) settingsBtn.addEventListener('click', ()=>openChannelSettings(id));
  const analyticsBtn = view.querySelector('#cd-analytics');
  if(analyticsBtn) analyticsBtn.addEventListener('click', ()=>openChannelAnalytics(id));
  const copyLinkBtn = view.querySelector('#cd-copy-link');
  if(copyLinkBtn) copyLinkBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    copyToClipboard('mentlis.channels/'+c.link);
  });
}

function toggleSubscribe(id){
  const c = channelById(id);
  c.subscribed = !c.subscribed;
  showToast(c.subscribed ? 'Вы подписались на «'+c.name+'»' : 'Вы отписались от «'+c.name+'»');
  if(c.subscribed) awardCoins(3, 'Подписка на канал «'+c.name+'»', document.getElementById('btn-coins'), 'channel_activity');
}

function openChannelDetail(id, returnTo){
  UI.activeChannelId = id;
  UI.channelDetailReturnTo = returnTo || UI.view || 'channels-list';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-channel-detail').classList.add('active');
  renderChannelDetail(id);
}

/* ============================================================
   CHANNEL SETTINGS (general / team & roles / privacy / danger)
============================================================ */
function openChannelSettings(id){
  UI.activeChannelId = id;
  UI.channelSettingsTab = 'general';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-channel-settings').classList.add('active');
  renderChannelSettings(id);
}
const CS_TABS = [{id:'general',label:'Основное'},{id:'team',label:'Команда'},{id:'subs',label:'Подписчики'},{id:'privacy',label:'Приватность'},{id:'log',label:'Журнал'},{id:'danger',label:'Удаление'}];
function renderChannelSettings(id){
  const c = channelById(id);
  const view = document.getElementById('view-channel-settings');
  const myRole = myRoleIn(c);
  const canEditTeam = myRole && ROLES[myRole].rank>=4; // co-owner+
  const tabs = CS_TABS.filter(t=> t.id!=='danger' || isChannelOwner(c));
  view.innerHTML = '<div class="header-row"><button class="back-btn" id="cs-back">'+svg('chevL',18)+'</button><div class="header-title">Настройки канала</div></div>'
    + '<div class="cs-tabs" id="cs-tabs"></div>'
    + '<div id="cs-body"></div>';
  view.querySelector('#cs-back').addEventListener('click', ()=>openChannelDetail(id));
  const tabsWrap = view.querySelector('#cs-tabs');
  tabsWrap.innerHTML = tabs.map(t=>'<button class="cs-tab '+(UI.channelSettingsTab===t.id?'active':'')+'" data-cstab="'+t.id+'">'+t.label+'</button>').join('');
  tabsWrap.querySelectorAll('[data-cstab]').forEach(b=>b.addEventListener('click', ()=>{ UI.channelSettingsTab=b.dataset.cstab; renderChannelSettings(id); }));
  if(UI.channelSettingsTab==='danger' && !isChannelOwner(c)) UI.channelSettingsTab='general';

  const body = view.querySelector('#cs-body');
  if(UI.channelSettingsTab==='general') body.innerHTML = csGeneralHTML(c);
  if(UI.channelSettingsTab==='team') body.innerHTML = csTeamHTML(c, canEditTeam);
  if(UI.channelSettingsTab==='subs') body.innerHTML = csSubsHTML(c);
  if(UI.channelSettingsTab==='privacy') body.innerHTML = csPrivacyHTML(c);
  if(UI.channelSettingsTab==='log') body.innerHTML = csLogHTML(c);
  if(UI.channelSettingsTab==='danger') body.innerHTML = csDangerHTML(c);
  wireChannelSettingsBody(c, canEditTeam);
}

function csTeamHTML(c, canEditTeam){
  const members = Object.keys(c.team||{});
  const nonMembers = USERS.filter(u=>!members.includes(u.id));
  return '<div class="role-legend">'+Object.entries(ROLES).map(([k,r])=>'<span>'+r.icon+' '+r.label+'</span>').join('')+'</div>'
    + (canEditTeam ? '<div class="settings-row" data-action="cs-invite" style="cursor:pointer;"><div class="rt">Пригласить участника</div>'+svg('plus',18)+'</div>' : '')
    + members.map(uid=>{
        const u = userById(uid); const role = c.team[uid];
        const isOwner = role==='owner';

function openChannelAnalytics(id){

const PERIODS = [{id:'day',label:'День',n:1},{id:'week',label:'Неделя',n:7},{id:'month',label:'Месяц',n:30},{id:'year',label:'Год',n:30},{id:'all',label:'Всё время',n:30}];
function sliceArr(arr,n){ return arr.slice(Math.max(0,arr.length-n)); }
function sum(arr){ return arr.reduce((s,v)=>s+v,0); }
function trendPct(arr){
  if(arr.length<2) return 0;
  const half = Math.floor(arr.length/2);
  const a = sum(arr.slice(0,half))||1, b = sum(arr.slice(half))||1;
  return Math.round(((b-a)/a)*100);
}
function sparkSVG(arr, w, h, color){
  w=w||280; h=h||64;
  const max = Math.max(...arr,1), min = Math.min(...arr,0);
  const range = (max-min)||1;
  const step = w/(arr.length-1||1);
  let d = arr.map((v,i)=>{ const x=i*step; const y=h-((v-min)/range)*h; return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1); }).join(' ');
  const areaD = d + ' L'+w+','+h+' L0,'+h+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px;">'
    + '<path d="'+areaD+'" fill="'+(color||'rgba(255,255,255,.08)')+'"></path>'
    + '<path d="'+d+'" fill="none" stroke="'+(color?color.replace('.08','1'):'#fff')+'" stroke-width="2" vector-effect="non-scaling-stroke"></path>'
    + '</svg>';
}
function barSVG(arr,w,h){
  w=w||280; h=h||90;
  const max = Math.max(...arr,1);
  const bw = w/arr.length*0.6, gap = w/arr.length;
  let bars = arr.map((v,i)=>{
    const bh = (v/max)*h;
    return '<rect x="'+(i*gap+(gap-bw)/2).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="#fff" opacity="'+(0.35+0.5*(v/max)).toFixed(2)+'"/>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;">'+bars+'</svg>';
}
function renderChannelAnalytics(id){
  const c = channelById(id);

  const posts = POSTS.filter(p=>p.channelId===id).slice().sort((x,y)=>y.resonance-x.resonance).slice(0,5);

      + statCard('Подписчики', fmtNum(c.members), trendPct(followers))

      + statCard('Комментарии', fmtNum(sum(comments)), trendPct(comments))

    + '<div class="chart-card"><h5>Прирост аудитории</h5>'+sparkSVG(followers)+'</div>'
    + '<div class="chart-card"><h5>Охват и просмотры</h5>'+sparkSVG(views,280,64,'rgba(255,255,255,.1)')+'</div>'
    + '<div class="chart-card"><h5>Активность аудитории по часам</h5>'+barSVG(a.hourly)+'</div>'
    + '<div class="trending-title">Самые популярные публикации</div>'
    + (posts.length ? posts.map((p,i)=>'<div class="top-post-row"><span class="rank">'+(i+1)+'</span><div class="txt">'+esc((p.text||'Без текста').slice(0,80))+'<div class="n">'+fmtNum(p.resonance)+' резонансов · '+fmtNum(p.views||0)+' просмотров</div></div></div>').join('') : emptyState('grid','Пока нет данных','Публикации канала появятся здесь.'));

  view.querySelector('#ca-back').addEventListener('click', ()=>openChannelDetail(id));
  const pr = view.querySelector('#period-row');
  pr.innerHTML = PERIODS.map(p=>'<button class="period-chip '+(UI.analyticsPeriod===p.id?'active':'')+'" data-period="'+p.id+'">'+p.label+'</button>').join('');

/* ============================================================
   STREAKS ("огоньки") — a TikTok-style daily flame between two
   users. Tapping the flame on someone's profile logs today's
   date; the streak count grows only if flames were sent on
   consecutive calendar days (Moscow time), and resets if a day
   was missed — same rules as the real feature it's modeled on.
============================================================ */
function mskDateKey(ts){
  const d = toMSKDate(ts||Date.now());
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function daysBetweenMSKKeys(a, b){
  const da = new Date(a+'T00:00:00Z'), db = new Date(b+'T00:00:00Z');
  return Math.round((db-da)/86400000);
}
function streakWith(userId){
  ME.streaks = ME.streaks || {};
  return ME.streaks[userId] || {count:0, lastDate:null};
}
function sendFlame(userId){
  ME.streaks = ME.streaks || {};
  const today = mskDateKey();
  const s = ME.streaks[userId] || {count:0, lastDate:null};
  if(s.lastDate === today){ showToast('Огонёк уже отправлен сегодня 🔥'); return s; }
  const gapDays = s.lastDate ? daysBetweenMSKKeys(s.lastDate, today) : null;
  if(s.lastDate && gapDays === 1) s.count += 1;       // sent again the very next day — streak grows
  else if(!s.lastDate) s.count = 1;                    // first flame ever with this person
  else s.count = 1;                                    // missed a day (or more) — streak resets
  s.lastDate = today;
  ME.streaks[userId] = s;
  scheduleSave();
  return s;
}
function streakBadgeHTML(userId){
  const s = streakWith(userId);
  if(!s.count) return '';
  const today = mskDateKey();
  const atRisk = s.lastDate && s.lastDate !== today && daysBetweenMSKKeys(s.lastDate, today) >= 1;

}

function buildActivityFeed(){
  const items = [];
  POSTS.filter(p=>p.authorId==='u0').forEach(p=>{
    const chan = p.channelId ? channelById(p.channelId) : null;
    items.push({cat:'posts', icon:'edit', text:'Опубликовали пост'+(chan?' в канале «'+esc(chan.name)+'»':''),
      sub: p.text ? esc(p.text.slice(0,64))+(p.text.length>64?'…':'') : '', mins:p.mins, createdAt:p.createdAt});
  });
  POSTS.forEach(p=>{
    (p.comments||[]).forEach(c=>{
      if(c.authorId==='u0'){
        const author = userById(p.authorId);
        items.push({cat:'comments', icon:'comment', text:'Комментарий у '+esc(author.name),
          sub: esc(c.text.slice(0,64))+(c.text.length>64?'…':''), mins:c.mins, createdAt:c.createdAt});
      }
    });
  });
  POSTS.filter(p=>p.resonated && p.authorId!=='u0').forEach(p=>{
    const author = userById(p.authorId);
    items.push({cat:'reactions', icon:'resonance', text:'Резонанс на пост '+esc(author.name),
      sub: p.text ? esc(p.text.slice(0,64))+(p.text.length>64?'…':'') : '', mins:p.mins, createdAt:p.createdAt});
  });
  POSTS.filter(p=>p.reposted).forEach(p=>{
    const author = userById(p.authorId);
    items.push({cat:'reactions', icon:'repost', text:'Репост публикации '+esc(author.name),
      sub: p.text ? esc(p.text.slice(0,64))+(p.text.length>64?'…':'') : '', mins:p.mins, createdAt:p.createdAt});
  });
  POSTS.filter(p=>p.bookmarked).forEach(p=>{
    const author = userById(p.authorId);
    items.push({cat:'reactions', icon:'bookmark', text:'Сохранена публикация '+esc(author.name),
      sub: p.text ? esc(p.text.slice(0,64))+(p.text.length>64?'…':'') : '', mins:p.mins, createdAt:p.createdAt});
  });
  CHANNELS.filter(c=>c.subscribed).forEach((c,i)=>{
    items.push({cat:'channels', icon:'people', text:'Подписка на канал «'+esc(c.name)+'»',
      sub: fmtNum(c.members)+' участников', mins: 800+i*530});
  });
  CHANNELS.forEach(c=>{
    (c.actionLog||[]).forEach(l=>{
      if(l.actorId==='u0'){
        items.push({cat:'channels', icon:'bolt', text:'В канале «'+esc(c.name)+'»: '+esc(l.action)+(l.targetId?' — '+esc(userById(l.targetId).name):''),
          sub:'', mins:l.mins});
      }
    });
  });
  items.sort((a,b)=>a.mins-b.mins);
  return items;
}

/* ============================================================
   CONSTELLATIONS (visual map of frequent interactions)
============================================================ */
function computeConnections(){
  const scores = {};
  USERS.forEach(u=>{ if(u.id!=='u0') scores[u.id]=0; });
  POSTS.forEach(p=>{
    (p.comments||[]).forEach(c=>{
      if(p.authorId==='u0' && c.authorId!=='u0' && scores[c.authorId]!==undefined) scores[c.authorId]+=3;
      if(c.authorId==='u0' && p.authorId!=='u0' && scores[p.authorId]!==undefined) scores[p.authorId]+=3;
    });
    if(p.authorId!=='u0' && scores[p.authorId]!==undefined){
      if(p.resonated) scores[p.authorId]+=2;
      if(p.reposted) scores[p.authorId]+=1;
      if(p.bookmarked) scores[p.authorId]+=1;
    }
  });
  NOTIFICATIONS.forEach(n=>{
    if(n.actorId && scores[n.actorId]!==undefined) scores[n.actorId]+=1;
  });
  return scores;
}
let constellationsReturnView = 'profile';
function openConstellations(){
  constellationsReturnView = UI.view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-constellations').classList.add('active');

function renderConstellations(){
  const view = document.getElementById('view-constellations');
  const scores = computeConnections();
  const ranked = Object.entries(scores).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const max = ranked.length ? ranked[0][1] : 1;
  const n = ranked.length;
  const cx=160, cy=160, R=116;
  let lines='', nodes='';
  ranked.forEach(([uid,score],i)=>{
    const u = userById(uid);
    const angle = (i/n)*Math.PI*2 - Math.PI/2;
    const x = cx + R*Math.cos(angle), y = cy + R*Math.sin(angle);
    const strength = score/max;
    const color = (u.mark && u.mark.color) || '#8fb4ff';
    lines += '<line class="const-line" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+color+'" stroke-width="'+(1+strength*3.5).toFixed(1)+'" opacity="'+(0.35+strength*0.55).toFixed(2)+'"/>';
    nodes += '<div class="const-node" data-open-profile="'+u.id+'" style="left:'+(x-24).toFixed(1)+'px;top:'+(y-24).toFixed(1)+'px;width:48px;height:48px;box-shadow:0 0 10px '+color+'88;" title="'+esc(u.name)+' · связь '+score+'">'+avatarHTML(u,48,false)+'</div>';
  });
  view.innerHTML = '<div class="header-row"><button class="back-btn" id="const-back">'+svg('chevL',18)+'</button><div class="header-title">Созвездия</div></div>'
    + '<div class="constellation-wrap">'
      + (n ? (
          '<div class="constellation-map" style="width:320px;height:320px;">'
            + '<svg viewBox="0 0 320 320" style="position:absolute;inset:0;width:100%;height:100%;">'+lines+'</svg>'
            + '<div class="const-node me" style="left:'+(cx-28)+'px;top:'+(cy-28)+'px;width:56px;height:56px;">'+avatarHTML(ME,56,false)+'</div>'
            + nodes
          + '</div>'

let newChannelAvatar = null, newChannelCover = null;
function normalizeChannelTag(raw){
  return (raw||'').trim().replace(/^mentlis\.channels\//i,'').replace(/^@/,'').toLowerCase().replace(/[^a-z0-9а-яё_]+/gi,'-').replace(/^-+|-+$/g,'');
}
function isChannelTagTaken(tag, excludeChannelId){
  return CHANNELS.some(c=>c.id!==excludeChannelId && c.link && c.link.toLowerCase()===tag.toLowerCase());
}
function uniqueChannelTag(base, excludeChannelId){
  let tag = base, n = 2;
  while(isChannelTagTaken(tag, excludeChannelId)){ tag = base+'-'+n; n++; }
  return tag;
}
/* Generates a short, memorable, digit-free random channel tag (e.g. "nova-ridge"),
   retrying with a new combination if the tag is already taken. */
const TAG_WORDS_A = ['nova','flux','echo','vibe','glow','wild','pure','calm','bold','edge','dawn','peak','tide','arc','loop','pulse','haze','glint','drift','core'];
const TAG_WORDS_B = ['ridge','lab','hub','flow','wave','space','field','path','spot','zone','loft','nest','base','yard','bay','grove','den','realm','forge','way'];
function generateRandomChannelTag(){
  let tag, guard = 0;
  do{
    const a = TAG_WORDS_A[Math.floor(Math.random()*TAG_WORDS_A.length)];
    const b = TAG_WORDS_B[Math.floor(Math.random()*TAG_WORDS_B.length)];
    tag = a+'-'+b;
    guard++;
  } while(isChannelTagTaken(tag, null) && guard < 30);
  return tag;
}

      CHANNELS.unshift({

      closeFormSheet();

      renderChannelsList();
    }
  );
  document.getElementById('f-clink-gen').addEventListener('click', ()=>{
    document.getElementById('f-clink').value = generateRandomChannelTag();

  document.getElementById('ncf-avatar-pick').addEventListener('click', ()=>document.getElementById('ncf-avatar-input').click());

const SEARCH_TABS = [
  {id:'all', label:'Всё'},

const SEARCH_HISTORY = [];
function commitSearchHistory(q){
  if(!q) return;
  const idx = SEARCH_HISTORY.findIndex(h=>h.toLowerCase()===q.toLowerCase());
  if(idx>-1) SEARCH_HISTORY.splice(idx,1);
  SEARCH_HISTORY.unshift(q);
  if(SEARCH_HISTORY.length>8) SEARCH_HISTORY.length=8;
}
function renderSearchTabs(){
  document.getElementById('search-tabs').innerHTML = SEARCH_TABS.map(t=>
    '<button class="stab '+(UI.searchTab===t.id?'active':'')+'" data-stab="'+t.id+'">'+t.label+'</button>'
  ).join('');
  document.querySelectorAll('[data-stab]').forEach(b=>b.addEventListener('click', ()=>{
    UI.searchTab = b.dataset.stab; renderSearch();
  }));
}
function trendingHashtags(n){
  const counts = {};
  POSTS.forEach(p=>(extractHashtags(p.text)||[]).forEach(t=>{ counts[t]=(counts[t]||0)+1+Math.floor(p.resonance/50); }));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n||8);
}
function matchHashtags(q){
  const counts = {};
  POSTS.forEach(p=>(extractHashtags(p.text)||[]).forEach(t=>{ counts[t]=(counts[t]||0)+1; }));
  const needle = q.replace(/^#/,'');
  return Object.entries(counts).filter(([t])=>t.slice(1).includes(needle)).sort((a,b)=>b[1]-a[1]);
}
function recommendedChannelsForSearch(){
  const notSub = CHANNELS.filter(c=>!c.subscribed);
  return notSub.slice().sort((a,b)=>(INTEREST.channels[b.id]||0)-(INTEREST.channels[a.id]||0) || b.members-a.members).slice(0,3);
}
function recommendedPeopleForSearch(){
  return USERS.filter(u=>u.id!=='u0').slice().sort((a,b)=>(INTEREST.authors[b.id]||0)-(INTEREST.authors[a.id]||0)).slice(0,3);
}

    let html = '';
    if(SEARCH_HISTORY.length){
      html += '<div class="search-hist-row"><div class="trending-title" style="padding:0;">Недавние запросы</div><button class="notif-clear" id="clear-hist-btn">Очистить</button></div>'

    if(recPeople.length || recChannels.length){

      + '<div class="chip-row" style="padding:0 18px 14px;">'+tags.map(([t])=>'<button class="chip" data-hashtag="'+t.slice(1)+'">'+t+'</button>').join('')+'</div>'

      + popular.map(p=>postResultRow(p)).join('')
      + '<div class="trending-title">Популярные каналы</div>'
      + CHANNELS.slice().sort((a,b)=>b.members-a.members).slice(0,4).map(c=>channelResultRow(c)).join('');
    results.innerHTML = html;
    wireSearchResultEvents();
    return;
  }
  // Recognize a pasted mentlis.channels/tag or mentlis.user/handle link and
  // search by the exact tag/handle it points to, instead of treating the
  // whole URL as a literal substring to find inside names/descriptions
  // (which almost never matched, making link search look broken).
  let linkQuery = null, linkKind = null;
  const chanLinkMatch = qRaw.match(/^(?:https?:\/\/)?mentlis\.channels\/([a-z0-9а-яё_-]+)\/?$/i);
  const userLinkMatch = qRaw.match(/^(?:https?:\/\/)?mentlis\.user\/([a-z0-9а-яё_-]+)\/?$/i);
  if(chanLinkMatch){ linkQuery = chanLinkMatch[1].toLowerCase(); linkKind='channel'; }
  else if(userLinkMatch){ linkQuery = userLinkMatch[1].toLowerCase(); linkKind='user'; }

  const matchPosts = linkQuery ? [] : POSTS.filter(p=>p.text && p.text.toLowerCase().includes(q));
  const matchTags = linkQuery ? [] : matchHashtags(q);
  const matchChannels = linkKind==='user' ? [] : CHANNELS.filter(c=>
    (linkQuery ? c.link && c.link.toLowerCase()===linkQuery : (c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || (c.link && c.link.toLowerCase().includes(q))))
  );
  const matchUsers = linkKind==='channel' ? [] : USERS.filter(u=>{
    const handleNoAt = u.handle.replace(/^@/,'').toLowerCase();
    return linkQuery ? handleNoAt===linkQuery : (u.name.toLowerCase().includes(q) || u.handle.toLowerCase().includes(q) || handleNoAt.includes(q));
  });

  const sections = [];
  if(UI.searchTab==='all' || UI.searchTab==='people') if(matchUsers.length) sections.push(['Люди', matchUsers.map(userResultRow).join('')]);
  if(UI.searchTab==='all' || UI.searchTab==='channels') if(matchChannels.length) sections.push(['Каналы', matchChannels.map(channelResultRow).join('')]);
  if(UI.searchTab==='all' || UI.searchTab==='posts') if(matchPosts.length) sections.push(['Посты', matchPosts.map(p=>postResultRow(p)).join('')]);
  if(UI.searchTab==='all' || UI.searchTab==='hashtags') if(matchTags.length) sections.push(['Хэштеги', matchTags.map(([t,n])=>hashtagResultRow(t,n)).join('')]);

  if(!sections.length){
    results.innerHTML = emptyState('grid','Ничего не найдено','Попробуйте изменить запрос или проверить написание.');
  } else {
    results.innerHTML = sections.map(([title,rows])=>'<div class="trending-title">'+title+'</div>'+rows).join('');
  }
  wireSearchResultEvents();
  renderSuggestions(q, matchUsers, matchChannels, matchPosts, matchTags);
}
function wireSearchResultEvents(){
  const clearHist = document.getElementById('clear-hist-btn');
  if(clearHist) clearHist.addEventListener('click', ()=>{ SEARCH_HISTORY.length=0; renderSearch(); });
  document.querySelectorAll('[data-hist-q]').forEach(chip=>chip.addEventListener('click', (e)=>{
    if(e.target.closest('[data-hist-remove]')) return;
    UI.searchQuery = chip.dataset.histQ;
    document.getElementById('search-input').value = UI.searchQuery;
    renderSearch();
  }));
  document.querySelectorAll('[data-hist-remove]').forEach(btn=>btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const i = SEARCH_HISTORY.indexOf(btn.dataset.histRemove);
    if(i>-1) SEARCH_HISTORY.splice(i,1);
    renderSearch();
  }));
  document.querySelectorAll('[data-hashtag-row]').forEach(row=>row.addEventListener('click', ()=>{
    UI.searchQuery = '#'+row.dataset.hashtagRow;
    UI.searchTab = 'hashtags';
    document.getElementById('search-input').value = UI.searchQuery;
    commitSearchHistory(UI.searchQuery);
    renderSearch();
  }));
}

async function startRecording(kind){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showToast('Запись недоступна в этом браузере'); return;
  }
  try{
    const constraints = kind==='circle' ? {audio:true, video:{facingMode:'user', width:480, height:480}} : {audio:true};
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    recordChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recordChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(recordChunks, {type: mediaRecorder.mimeType||(kind==='circle'?'video/webm':'audio/webm')});
      const dur = Math.max(1, Math.round((Date.now()-recordStart)/1000));
      const reader = new FileReader();
      reader.onload = ()=>{
        if(kind==='circle'){ composerState.circle = {src:reader.result, duration:dur}; composerState.mode='circle'; }
        else { composerState.voice = {src:reader.result, duration:dur}; composerState.mode='voice'; }
        renderComposerAttachments(); updatePublishState();
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    recordStart = Date.now();
    composerState.mode = kind+'-recording';
    renderComposerAttachments();
  } catch(err){
    showToast('Нет доступа к микрофону/камере');
  }
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
}

  if(composerState.mode==='voice-recording'){ stopRecording(); return; }
  if(composerState.voice){ composerState.voice=null; composerState.mode=null; renderComposerAttachments(); updatePublishState(); return; }
  startRecording('voice');
});
document.getElementById('attach-circle-btn').addEventListener('click', ()=>{

  if(composerState.circle){ composerState.circle=null; composerState.mode=null; renderComposerAttachments(); updatePublishState(); return; }
  startRecording('circle');
});
async function addComposerImages(fileList){
  const files = Array.from(fileList).slice(0,4-composerState.images.length);
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    const compressed = await compressImageFile(f, 1600, .85);
    composerState.images.push(compressed);
    renderComposerAttachments();
    updatePublishState();
  }
}

  const id = nextId('p');
  let type='text', img=null, poll=null;
  if(composerState.mode==='photo' && composerState.images.length){ type='photo'; img=composerState.images[0]; }
  if(composerState.mode==='poll'){
    const opts = composerState.pollOptions.filter(o=>o.trim()).map(t=>({text:t.trim(),votes:0}));
    if(opts.length>=2){ type='poll'; poll={options:opts, voted:false, choice:null}; }
  }
  if(composerState.voice) type='voice';
  if(composerState.circle) type='circle';
  const newPost = {
    id, authorId:'u0', channelId: composerState.targetChannelId, type,
    text: composerState.text.trim(), img, poll,
    voice: composerState.voice, circle: composerState.circle,
    coAuthorIds: composerState.coAuthors.length ? composerState.coAuthors.slice() : undefined,
    mins:0, createdAt: Date.now(), resonance:0, resonated:false, reposted:false, bookmarked:false, pinned:false, views:0,
    reactions:{}, myReactions:[], comments:[]
  };
  POSTS.unshift(newPost);
  trackInteraction(newPost, 1);
  ME.stats.posts++;
  composerState.text=''; composerState.images=[]; composerState.pollQuestion=''; composerState.pollOptions=['',''];
  composerState.mode=null; composerState.targetChannelId=null; composerState.voice=null; composerState.circle=null; composerState.coAuthors=[];
  closeComposer();
  queueOrToast(newPost.coAuthorIds ? 'Совместная публикация опубликована' : 'Опубликовано');
  awardCoins(15, 'Публикация опубликована', document.getElementById('btn-coins'), 'post');
  simulateIncomingEngagement(newPost);
  if(UI.view==='feed') renderFeed();
  if(UI.view==='channel-detail' && UI.activeChannelId===newPost.channelId) renderChannelDetail(UI.activeChannelId);
  if(UI.view==='profile') renderProfile();
});

const commentsOverlay = document.getElementById('comments-overlay');
const commentsWrap = document.getElementById('comments-wrap');
const commentsSheet = document.getElementById('comments-sheet');

let commentDraftImage = null;
function openComments(postId){
  UI.activeCommentsPostId = postId;
  UI.replyTarget = null;
  commentDraftImage = null;
  renderComments();
  document.getElementById('comment-input-avatar').innerHTML = avatarHTML(ME,34,false);
  document.getElementById('comment-input').value='';
  document.getElementById('comment-send').disabled=true;
  document.getElementById('comment-attach-btn').innerHTML = svg('camera',16);
  updateReplyPill();
  updateCommentImgPreview();
  commentsOverlay.classList.add('show'); commentsWrap.classList.add('show');
  requestAnimationFrame(()=>{ commentsSheet.style.transform='translateY(0)'; });
}
function closeComments(){
  commentsSheet.style.transform='translateY(100%)';
  setTimeout(()=>{ commentsOverlay.classList.remove('show'); commentsWrap.classList.remove('show'); }, 280);
}
function commentTree(post){
  const top = post.comments.filter(c=>!c.parentId);
  const byParent = {};
  post.comments.filter(c=>c.parentId).forEach(c=>{ (byParent[c.parentId]=byParent[c.parentId]||[]).push(c); });
  return {top, byParent};
}
function sortComments(list){
  if(UI.commentSort==='top') return list.slice().sort((a,b)=>(b.pinned-a.pinned)||(b.likes-a.likes));
  return list.slice().sort((a,b)=>a.mins-b.mins);
}
function commentRowHTML(c, post, isReply){
  const a = userById(c.authorId);
  const canModerate = post.authorId==='u0'; // post owner can pin
  const isMine = c.authorId==='u0';
  return '<div class="comment-row '+(isReply?'reply-row':'')+'" data-cid="'+c.id+'"><span data-open-profile="'+a.id+'" style="cursor:pointer;">'+avatarHTML(a,isReply?28:36,false)+'</span>'
    + '<div class="comment-bubble">'
      + (c.pinned ? '<div class="comment-pinned-flag">'+svg('pin',10)+'Закреплено автором</div>' : '')
      + '<span class="name" data-open-profile="'+a.id+'" style="cursor:pointer;">'+esc(a.name)+'</span>'+markHTML(a,12)+'<span class="time">'+fmtTime(c.createdAt||c.mins)+'</span>'
      + '<p>'+richText(c.text)+'</p>'
      + (c.image ? '<img class="comment-img" src="'+c.image+'" data-lightbox="'+c.image+'">' : '')
      + '<div class="comment-actions">'
        + '<button class="c-like-btn '+(c.likedByMe?'on':'')+'" data-action="like-comment" data-cid="'+c.id+'">'+svg('heart',14)+'<span>'+fmtNum(c.likes)+'</span></button>'
        + (!isReply ? '<button class="c-mini-link" data-action="reply-comment" data-cid="'+c.id+'">Ответить</button>' : '')
        + (isMine ? '<button class="c-mini-link" data-action="edit-comment" data-cid="'+c.id+'">Изменить</button>' : '')
        + (isMine ? '<button class="c-mini-link" data-action="delete-comment" data-cid="'+c.id+'">Удалить</button>' : '')
        + (canModerate ? '<button class="c-mini-link" data-action="pin-comment" data-cid="'+c.id+'">'+(c.pinned?'Открепить':'Закрепить')+'</button>' : '')
      + '</div>'
    + '</div></div>';
}
function renderComments(){
  const post = postById(UI.activeCommentsPostId);
  document.getElementById('comments-title').textContent = 'Комментарии · '+countComments(post);
  const list = document.getElementById('comments-list');
  if(!post.comments.length){
    list.innerHTML = emptyState('comment','Пока тихо','Будьте первым, кто оставит комментарий.');
    return;
  }
  const {top, byParent} = commentTree(post);
  const sortedTop = sortComments(top);
  let html = '<div class="comments-toolbar"><div class="sort-select">'
    + '<button class="sort-chip '+(UI.commentSort==='top'?'active':'')+'" data-csort="top">Топ</button>'
    + '<button class="sort-chip '+(UI.commentSort==='new'?'active':'')+'" data-csort="new">Новые</button>'
    + '</div></div>';
  html += sortedTop.map(c=>{
    const replies = (byParent[c.id]||[]).sort((a,b)=>a.mins-b.mins);
    return commentRowHTML(c,post,false)
      + (replies.length ? '<div class="comment-replies">'+replies.map(r=>commentRowHTML(r,post,true)).join('')+'</div>' : '');
  }).join('');
  list.innerHTML = html;
  list.querySelectorAll('[data-csort]').forEach(b=>b.addEventListener('click', ()=>{ UI.commentSort=b.dataset.csort; renderComments(); }));
}
function updateReplyPill(){
  const pill = document.getElementById('reply-pill');
  if(UI.replyTarget){
    document.getElementById('reply-pill-text').textContent = 'Ответ для '+userById(UI.replyTarget.authorId).name;
    pill.style.display='flex';
  } else {
    pill.style.display='none';
  }
}
function updateCommentImgPreview(){
  const wrap = document.getElementById('comment-img-preview');
  if(commentDraftImage){
    wrap.style.display='block';
    wrap.innerHTML = '<div class="cip-thumb"><img src="'+commentDraftImage+'"><button id="cip-remove">'+svg('x',10)+'</button></div>';
    document.getElementById('cip-remove').addEventListener('click', ()=>{ commentDraftImage=null; updateCommentImgPreview(); updateCommentSendState(); });
  } else {
    wrap.style.display='none'; wrap.innerHTML='';

}
function updateCommentSendState(){
  const text = document.getElementById('comment-input').value.trim();

}

const SESSION_COUNTERS = { comments:0 };
function submitComment(){
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if(!text && !commentDraftImage) return;
  const post = postById(UI.activeCommentsPostId);
  const newComment = {id:nextId('cm'), authorId:'u0', text, mins:0, createdAt: Date.now(), parentId: UI.replyTarget ? UI.replyTarget.id : null, image:commentDraftImage, likes:0, likedByMe:false, pinned:false};
  post.comments.push(newComment);
  input.value=''; commentDraftImage=null; UI.replyTarget=null;
  document.getElementById('comment-send').disabled=true;
  updateReplyPill(); updateCommentImgPreview();
  renderComments();
  updateCommentCountInDom(post);
  queueOrToast('Комментарий опубликован');
  SESSION_COUNTERS.comments++;
  awardCoins(5, 'Комментарий опубликован', document.getElementById('comment-send'), 'comment');
  if(SESSION_COUNTERS.comments>=10) unlockAchievement('commenter50');
}
function updateCommentCountInDom(post){
  document.querySelectorAll('[data-action="comment"][data-id="'+post.id+'"] span:last-child').forEach(s=>{
    s.textContent = fmtNum(countComments(post));
  });
}
document.getElementById('comments-list').addEventListener('click', (e)=>{
  const post = postById(UI.activeCommentsPostId);
  const likeBtn = e.target.closest('[data-action="like-comment"]');
  if(likeBtn){
    const c = post.comments.find(x=>x.id===likeBtn.dataset.cid);
    c.likedByMe = !c.likedByMe; c.likes += c.likedByMe?1:-1;
    renderComments();
    return;
  }
  const replyBtn = e.target.closest('[data-action="reply-comment"]');
  if(replyBtn){
    const c = post.comments.find(x=>x.id===replyBtn.dataset.cid);
    UI.replyTarget = c;
    const handle = userById(c.authorId).handle;
    document.getElementById('reply-pill-text').textContent = 'Ответ для '+userById(c.authorId).name;
    document.getElementById('reply-pill').style.display='flex';
    const input = document.getElementById('comment-input');
    if(!input.value.trim().startsWith('@')){
      input.value = handle+' ';
      updateCommentSendState();
    }
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    return;
  }
  const editBtn = e.target.closest('[data-action="edit-comment"]');
  if(editBtn){
    const row = e.target.closest('.comment-row');
    const c = post.comments.find(x=>x.id===editBtn.dataset.cid);
    const bubble = row.querySelector('.comment-bubble p');
    bubble.outerHTML = '<textarea class="comment-edit-input" id="edit-input-'+c.id+'">'+esc(c.text)+'</textarea><button class="c-mini-link" data-action="save-edit" data-cid="'+c.id+'" style="margin-top:6px;">Сохранить</button>';
    return;
  }
  const saveEdit = e.target.closest('[data-action="save-edit"]');
  if(saveEdit){
    const c = post.comments.find(x=>x.id===saveEdit.dataset.cid);
    const val = document.getElementById('edit-input-'+c.id).value.trim();
    if(val) c.text = val;
    renderComments();
    return;
  }
  const delBtn = e.target.closest('[data-action="delete-comment"]');
  if(delBtn){
    if(confirm('Удалить комментарий?')){
      post.comments = post.comments.filter(x=>x.id!==delBtn.dataset.cid && x.parentId!==delBtn.dataset.cid);
      renderComments();
      updateCommentCountInDom(post);
    }
    return;
  }
  const pinBtn = e.target.closest('[data-action="pin-comment"]');
  if(pinBtn){
    post.comments.forEach(c=>{ if(c.id!==pinBtn.dataset.cid) c.pinned=false; });
    const c = post.comments.find(x=>x.id===pinBtn.dataset.cid);
    c.pinned = !c.pinned;
    renderComments();
    return;
  }
});

document.addEventListener('click', (e)=>{
  // resonate
  const resBtn = e.target.closest('[data-action="resonate"]');
  if(resBtn){
    const id = resBtn.dataset.id;
    const post = postById(id);
    post.resonated = !post.resonated;
    post.resonance += post.resonated ? 1 : -1;
    resBtn.classList.toggle('on', post.resonated);
    const countEl = resBtn.querySelector('.count-pop');
    countEl.textContent = fmtNum(post.resonance);
    countEl.classList.remove('pop'); void countEl.offsetWidth; countEl.classList.add('pop');
    if(post.resonated){
      resBtn.classList.add('bursting');
      setTimeout(()=>resBtn.classList.remove('bursting'), 650);
      trackInteraction(post,3);
      awardCoins(2, 'Резонанс на публикацию', resBtn, 'resonate');
    }
    return;
  }
  // comment
  const comBtn = e.target.closest('[data-action="comment"]');
  if(comBtn){ openComments(comBtn.dataset.id); return; }

  // repost
  const repBtn = e.target.closest('[data-action="repost"]');
  if(repBtn){
    const post = postById(repBtn.dataset.id);
    toggleRepost(post);
    return;
  }
  // bookmark
  const bkBtn = e.target.closest('[data-action="bookmark"]');
  if(bkBtn){
    const post = postById(bkBtn.dataset.id);
    post.bookmarked = !post.bookmarked;
    bkBtn.classList.toggle('on', post.bookmarked);
    if(post.bookmarked) trackInteraction(post,2);
    queueOrToast(post.bookmarked ? 'Сохранено' : 'Удалено из сохранённого');
    if(document.getElementById('bookmarks-list')) renderBookmarksList();
    scheduleSave();
    return;
  }
  // post menu toggle
  const pmBtn = e.target.closest('[data-action="post-menu"]');
  if(pmBtn){
    document.querySelectorAll('.post-menu.show').forEach(m=>{ if(m.id!=='pm-'+pmBtn.dataset.id) m.classList.remove('show'); });
    document.getElementById('pm-'+pmBtn.dataset.id).classList.toggle('show');
    return;
  }
  // toggle pin
  const pinBtn = e.target.closest('[data-action="toggle-pin"]');
  if(pinBtn){
    const post = postById(pinBtn.dataset.id);
    if(ME.pinnedPostId===post.id){ ME.pinnedPostId=null; post.pinned=false; showToast('Публикация откреплена'); }
    else {
      const prev = postById(ME.pinnedPostId); if(prev) prev.pinned=false;
      ME.pinnedPostId = post.id; post.pinned=true; showToast('Публикация закреплена в профиле');
    }
    document.getElementById('pm-'+post.id).classList.remove('show');
    if(UI.view==='feed') renderFeed();
    if(UI.view==='profile') renderProfile();
    return;
  }
  // delete post
  const delBtn = e.target.closest('[data-action="delete-post"]');
  if(delBtn){
    const idx = POSTS.findIndex(p=>p.id===delBtn.dataset.id);
    if(idx>-1 && confirm('Удалить публикацию без возможности восстановления?')){
      if(ME.pinnedPostId===POSTS[idx].id) ME.pinnedPostId=null;
      POSTS.splice(idx,1);
      ME.stats.posts = Math.max(0, ME.stats.posts-1);
      showToast('Публикация удалена');
      if(UI.view==='feed') renderFeed();
      if(UI.view==='profile') renderProfile();
    }
    return;
  }
  // report post
  const reportBtn = e.target.closest('[data-action="report-post"]');
  if(reportBtn){
    const post = postById(reportBtn.dataset.id);
    document.getElementById('pm-'+post.id).classList.remove('show');
    if(post) openReportSheet('post', post.id, post.authorId);
    return;
  }
  // translate post
  const translateBtn = e.target.closest('[data-action="translate"]');
  if(translateBtn){
    translatePostText(translateBtn.dataset.id, translateBtn);
    return;
  }
  // profile stat blocks
  const statBlock = e.target.closest('[data-open-stat]');
  if(statBlock){
    const key = statBlock.dataset.openStat;
    if(key==='followers' || key==='following'){
      const list = USERS.filter(u=>u.id!=='u0').slice(0, key==='followers'?7:5);
      openFormSheet(key==='followers'?'Подписчики':'Подписки',
        list.map(u=>'<div class="result-row" data-open-profile="'+u.id+'" style="padding:10px 0;cursor:pointer;">'+avatarHTML(u,40)+'<div class="rtext"><div class="rname">'+esc(u.name)+markHTML(u,13)+'</div><div class="rsub">'+esc(u.handle)+'</div></div></div>').join(''),
        ()=>closeFormSheet(), 'Закрыть'
      );
    } else if(key==='likes'){
      showToast('Всего лайков на публикациях: '+fmtNum(ME.stats.likes));
    } else if(key==='views'){
      showToast('Всего просмотров публикаций: '+fmtNum(ME.stats.views));
    }
    return;
  }
  const tagEl = e.target.closest('[data-hashtag]');
  if(tagEl){
    UI.searchQuery = '#'+tagEl.dataset.hashtag;
    UI.searchTab = 'hashtags';
    switchView('search');
    document.getElementById('search-input').value = UI.searchQuery;
    renderSearch();
    return;
  }
  const mentionEl = e.target.closest('[data-mention]');
  if(mentionEl){
    const u = USERS.find(x=>x.handle.replace('@','').toLowerCase()===mentionEl.dataset.mention);
    if(u) openProfileOf(u.id);
    return;
  }
  // poll vote
  const pollOpt = e.target.closest('.poll-opt');
  if(pollOpt){
    const post = postById(pollOpt.dataset.post);
    if(post.poll.voted) return;
    const idx = +pollOpt.dataset.opt;
    post.poll.voted = true; post.poll.choice = idx;
    post.poll.options[idx].votes++;
    const card = pollOpt.closest('.post');
    const pollWrap = card.querySelector('.poll');
    pollWrap.outerHTML = pollHTML(post);
    return;
  }
  // feed chip filter
  const chip = e.target.closest('[data-chip]');
  if(chip){
    UI.feedChannelFilter = chip.dataset.chip==='all' ? null : chip.dataset.chip;
    renderFeed();
    return;
  }
  // channel subscribe button (list)
  const voiceBtn = e.target.closest('[data-voice-play]');
  if(voiceBtn){
    const audio = document.getElementById('voice-'+voiceBtn.dataset.voicePlay);
    const btn = voiceBtn.querySelector('.voice-play-btn');
    if(!audio) return;
    if(audio.paused){
      document.querySelectorAll('.voice-msg audio').forEach(a=>{ if(a!==audio){ a.pause(); a.currentTime=0; a.closest('.voice-msg').classList.remove('playing'); const b=a.closest('.voice-msg').querySelector('.voice-play-btn'); if(b) b.innerHTML=svg('play',15); } });
      audio.play(); btn.innerHTML=svg('pause',15); voiceBtn.classList.add('playing');
      audio.onended = ()=>{ btn.innerHTML=svg('play',15); voiceBtn.classList.remove('playing'); };
    } else {
      audio.pause(); btn.innerHTML=svg('play',15); voiceBtn.classList.remove('playing');
    }
    return;
  }
  const circleBtn = e.target.closest('[data-circle-play]');
  if(circleBtn){
    const video = document.getElementById('circle-'+circleBtn.dataset.circlePlay);
    if(!video) return;
    if(video.paused){ video.play(); circleBtn.classList.add('playing'); }
    else { video.pause(); circleBtn.classList.remove('playing'); }
    return;
  }
  const subBtn = e.target.closest('[data-sub]');
  if(subBtn){
    toggleSubscribe(subBtn.dataset.sub);
    if(document.getElementById('channels-list') && UI.view==='channels') renderChannelsList();
    if(document.getElementById('feed-list') && UI.view==='feed') renderFeed();
    return;
  }
  // open channel detail
  const openChan = e.target.closest('[data-open-channel]');
  if(openChan){ openChannelDetail(openChan.dataset.openChannel); return; }

  // open comments from search results
  const openCom = e.target.closest('[data-open-comments]');
  if(openCom){ openComments(openCom.dataset.openComments); return; }

  // open profile from search / mentions / result rows
  const openProf = e.target.closest('[data-open-profile]');
  if(openProf){
    openProfileOf(openProf.dataset.openProfile);
    return;
  }
  // lightbox
  const lbImg = e.target.closest('[data-lightbox]');
  if(lbImg){
    document.getElementById('lightbox-img').src = lbImg.dataset.lightbox;
    document.getElementById('lightbox').classList.add('show');
    return;
  }
});

/* ============================================================
   PERSISTENCE — IndexedDB via MentlisDB (survives reload / restart /
   reopen), with live sync from the admin panel (bans, deletions,
   profile edits, shop changes, etc. show up here immediately).
============================================================ */
const STORAGE_KEY = 'mentlis_state_v1';
function snapshotState(){
  return {
    me: ME, users: USERS, posts: POSTS, channels: CHANNELS, notifications: NOTIFICATIONS,
    coinLog: COIN_LOG, questions: QUESTIONS, reports: REPORTS, frames: FRAMES, statuses: STATUSES, covers: COVERS,
    ui: {trueBlack:UI.trueBlack, privateAccount:UI.privateAccount, notifLikes:UI.notifLikes, notifComments:UI.notifComments, notifFollowers:UI.notifFollowers, theme:UI.theme},
    uidCounter: uidCounter
  };
}
function saveState(){
  const appEl = document.getElementById('app');
  if(appEl && appEl.style.display==='none') return; // not logged in yet — nothing real to save
  const snap = snapshotState();
  try{ lastSavedSnapshot = JSON.stringify(snap); }catch(err){}
  MentlisDB.set(STORAGE_KEY, snap);
}
/* Repairs any createdAt values that aren't a sane, real timestamp — this
   guards against corrupted or pre-migration data left over in a browser's
   IndexedDB/localStorage from an earlier version of the app that didn't
   have this field yet, which could otherwise render as absurd ages like
   "2952 недели назад". Anything invalid gets a fresh "just now" stamp
   instead of being trusted blindly. */
function sanitizeTimestamp(val){
  if(typeof val==='number' && isFinite(val) && val>=MENTLIS_LAUNCH_MS && val<=Date.now()+86400000) return val;
  return Date.now();
}
function sanitizeAllTimestamps(){
  POSTS.forEach(p=>{
    p.createdAt = sanitizeTimestamp(p.createdAt);
    (p.comments||[]).forEach(c=>{ c.createdAt = sanitizeTimestamp(c.createdAt); });
  });
  NOTIFICATIONS.forEach(n=>{ if(n.createdAt!==undefined) n.createdAt = sanitizeTimestamp(n.createdAt); });
  QUESTIONS.forEach(q=>{ if(q.createdAt!==undefined) q.createdAt = sanitizeTimestamp(q.createdAt); });
  CHANNELS.forEach(c=>{ (c.actionLog||[]).forEach(l=>{ if(l.createdAt!==undefined) l.createdAt = sanitizeTimestamp(l.createdAt); }); });
}
async function loadPersistedState(){
  try{
    const data = await MentlisDB.get(STORAGE_KEY);
    if(!data) return;
    if(Array.isArray(data.posts)){ POSTS.length=0; data.posts.forEach(p=>POSTS.push(p)); }
    if(Array.isArray(data.channels)){ CHANNELS.length=0; data.channels.forEach(c=>CHANNELS.push(c)); }
    if(Array.isArray(data.notifications)){ NOTIFICATIONS.length=0; data.notifications.forEach(n=>NOTIFICATIONS.push(n)); }
    if(Array.isArray(data.coinLog)){ COIN_LOG.length=0; data.coinLog.forEach(l=>COIN_LOG.push(l)); }
    if(Array.isArray(data.questions)){ QUESTIONS.length=0; data.questions.forEach(q=>QUESTIONS.push(q)); }
    if(Array.isArray(data.reports)){ REPORTS.length=0; data.reports.forEach(r=>REPORTS.push(r)); }
    if(Array.isArray(data.frames) && data.frames.length){ FRAMES.length=0; data.frames.forEach(f=>FRAMES.push(f)); }
    if(Array.isArray(data.statuses) && data.statuses.length){ STATUSES.length=0; data.statuses.forEach(s=>STATUSES.push(s)); }
    if(Array.isArray(data.covers) && data.covers.length){ COVERS.length=0; data.covers.forEach(c=>COVERS.push(c)); }
    if(data.ui) Object.assign(UI, data.ui);
    if(typeof data.uidCounter==='number') uidCounter = Math.max(uidCounter, data.uidCounter);

    // USERS/ME must stay the same object identity throughout the app (ME === USERS[0]).
    // Rebuild USERS in place first, then re-sync ME to point at the persisted USERS[0]
    // (falling back to the standalone "me" snapshot for solo-saved sessions/older data).
    if(Array.isArray(data.users) && data.users.length){
      USERS.length=0; data.users.forEach(u=>USERS.push(u));
      if(data.me && USERS[0] && USERS[0].id===data.me.id) Object.assign(USERS[0], data.me, {id:USERS[0].id});
      Object.keys(ME).forEach(k=>{ delete ME[k]; });
      Object.assign(ME, USERS[0]);
      USERS[0] = ME;
    } else if(data.me){
      Object.assign(ME, data.me);
    }
    sanitizeAllTimestamps();
  } catch(err){ /* corrupted snapshot — start fresh instead of crashing */ }
}
let saveTimer = null;
let lastSavedSnapshot = '';
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }
document.addEventListener('click', scheduleSave, true);
document.addEventListener('input', scheduleSave, true);
document.addEventListener('change', scheduleSave, true);

/* Multiple redundant save triggers so nothing is lost no matter how the app is closed:
   - beforeunload: covers normal tab/window close on desktop
   - pagehide: fires reliably on mobile browsers and PWAs when beforeunload doesn't
   - visibilitychange: covers switching apps / locking the phone without fully closing it
   - periodic safety-net: covers crashes, force-quits, or a debounce timer that never got to fire */
window.addEventListener('beforeunload', saveState);
window.addEventListener('pagehide', saveState);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveState(); });
setInterval(()=>{
  const appEl = document.getElementById('app');
  if(appEl && appEl.style.display==='none') return; // not logged in yet
  try{
    const snap = JSON.stringify(snapshotState());
    if(snap !== lastSavedSnapshot){ lastSavedSnapshot = snap; MentlisDB.set(STORAGE_KEY, JSON.parse(snap)); }
  }catch(err){ /* best effort */ }
}, 5000);

/* Keeps relative timestamps ("5m", "1h") advancing on screen without a full
   re-render — post/comment/notification times were otherwise frozen at
   whatever they said when that DOM node was first drawn. */
setInterval(()=>{
  document.querySelectorAll('.post-time[title]').forEach(el=>{
    const post = POSTS.find(p=>p.createdAt && el.closest('.post') && el.closest('.post').dataset.id===p.id);
    if(post) el.textContent = fmtTime(post.createdAt||post.mins);
  });
}, 30000);

/* Live updates coming from the admin panel (or another Mentlis tab):
   re-hydrate in place and re-render so the change is visible without a manual reload. */
let applyingRemoteState = false;
MentlisDB.onChange(STORAGE_KEY, async (remote)=>{
  if(!remote || applyingRemoteState) return;
  const appEl = document.getElementById('app');
  if(appEl && appEl.style.display==='none') return; // not logged in yet — nothing to refresh
  applyingRemoteState = true;
  try{
    const myId = ME.id;
    await loadPersistedState();
    const meNow = USERS.find(u=>u.id===myId);
    if(meNow && meNow.blocked){
      showBlockedScreen(meNow.blockReason);
      return;
    }
    refreshCurrentView();
  } finally { applyingRemoteState = false; }
});

function refreshCurrentView(){
  try{
    renderCoinBalance(false);
    renderFeedModeToggle();
    renderFeedSourceToggle();
    if(typeof renderFeed==='function') renderFeed();
    if(typeof renderChannelsList==='function') renderChannelsList();
    if(typeof renderProfile==='function' && (UI.view==='profile'||UI.view==='other-profile')) renderProfile();
    showToast('Данные обновлены администратором');
  }catch(err){ /* best-effort refresh; next navigation will show fresh data anyway */ }
}

function showBlockedScreen(reason){
  document.getElementById('app').innerHTML =
    '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:14px;">'
    + '<div style="font-family:var(--font-d);font-size:22px;font-weight:700;">Аккаунт заблокирован</div>'
    + '<div style="color:var(--text-dim);font-size:14.5px;max-width:320px;line-height:1.5;">'+(reason ? esc(reason) : 'Ваш аккаунт был заблокирован администрацией Mentlis за нарушение правил сообщества.')+'</div>'
    + '</div>';
}

/* ============================================================
   AUTHENTICATION
   Accounts are stored separately from the main app snapshot, keyed
   by handle, with SHA-256 password hashes (via the browser's native
   SubtleCrypto — no server, no plaintext passwords at rest). A
   session just remembers which account is currently active; signing
   in swaps ME's contents to that account's profile, mutating the
   same object identity everywhere else in the app already relies on
   (ME === USERS[0]) rather than reassigning the const.
============================================================ */
const ACCOUNTS_KEY = 'mentlis_accounts';
const SESSION_KEY = 'mentlis_session';

async function hashPassword(pw){
  const enc = new TextEncoder().encode('mentlis_salt_v1:'+pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function loadAccounts(){
  return (await MentlisDB.get(ACCOUNTS_KEY)) || [];
}
async function saveAccounts(accounts){
  await MentlisDB.set(ACCOUNTS_KEY, accounts, {silent:true});
}
function normalizeHandle(raw){
  return '@'+(raw||'').trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9._]/g,'');
}

function showAuthError(elId, msg){
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.add('show');
}
function clearAuthError(elId){
  const el = document.getElementById(elId);
  el.textContent = '';
  el.classList.remove('show');
}

async function handleRegister(e){
  e.preventDefault();
  clearAuthError('re-error');
  const name = document.getElementById('re-name').value.trim();
  const handle = normalizeHandle(document.getElementById('re-username').value);
  const pw = document.getElementById('re-password').value;
  const pw2 = document.getElementById('re-password2').value;
  if(!name){ showAuthError('re-error','Введите имя'); return; }
  if(handle.length<3){ showAuthError('re-error','Никнейм должен быть не короче 2 символов'); return; }
  if(pw.length<4){ showAuthError('re-error','Пароль должен быть не короче 4 символов'); return; }
  if(pw!==pw2){ showAuthError('re-error','Пароли не совпадают'); return; }

  const accounts = await loadAccounts();
  if(accounts.some(a=>a.handle===handle)){ showAuthError('re-error','Этот никнейм уже занят'); return; }

  const passwordHash = await hashPassword(pw);

  // If this is the very first account ever created on this device, and there's
  // pre-existing content under the legacy single-user profile (posts made
  // before the login system existed), hand that profile over to this new
  // account instead of silently orphaning its posts/coins/progress.
  const legacyProfile = accounts.length===0 ? USERS.find(u=>u.id==='u0') : null;
  const hasLegacyContent = legacyProfile && (
    POSTS.some(p=>p.authorId==='u0') || CHANNELS.some(c=>c.ownerId==='u0') || (legacyProfile.coins||0) > 200
  );

  let userId;
  if(hasLegacyContent){
    userId = 'u0';
    legacyProfile.name = name;
    legacyProfile.handle = handle;
  } else {
    userId = nextId('u');
    const newProfile = {
      id:userId, name, handle, bio:'', avatar:null, avatarType:null, cover:null, live:false,
      status:'', mark:null, links:[], pinnedPostId:null, xp:0, achievements:[],
      coins:200, equippedFrame:'f-silver', ownedFrames:['f-silver'],
      equippedStatus:null, ownedStatuses:[],
      equippedCover:null, ownedCovers:['cov-midnight'],
      stats:{posts:0, followers:0, following:0, likes:0, views:0}
    };
    USERS.push(newProfile);
  }
  accounts.push({id:userId, handle, passwordHash});
  await saveAccounts(accounts);

  await signInAs(userId);
  showToast('Добро пожаловать в Mentlis, '+name+'!');
}

async function handleLogin(e){
  e.preventDefault();
  clearAuthError('li-error');
  const handle = normalizeHandle(document.getElementById('li-username').value);
  const pw = document.getElementById('li-password').value;
  if(!handle || handle==='@'){ showAuthError('li-error','Введите никнейм'); return; }
  if(!pw){ showAuthError('li-error','Введите пароль'); return; }

  const accounts = await loadAccounts();
  const account = accounts.find(a=>a.handle===handle);
  if(!account){ showAuthError('li-error','Аккаунт с таким никнеймом не найден'); return; }
  const hash = await hashPassword(pw);
  if(hash !== account.passwordHash){ showAuthError('li-error','Неверный пароль'); return; }

  let profile = USERS.find(u=>u.id===account.id);
  if(!profile){
    // profile data missing from the shared app snapshot (e.g. cleared separately) —
    // rebuild a minimal one rather than leaving the user stuck unable to log in
    profile = {id:account.id, name:account.handle.replace('@',''), handle:account.handle, bio:'', avatar:null,
      cover:null, live:false, status:'', mark:null, links:[], pinnedPostId:null, xp:0, achievements:[],
      coins:200, equippedFrame:'f-silver', ownedFrames:['f-silver'], equippedStatus:null, ownedStatuses:[],
      equippedCover:null, ownedCovers:['cov-midnight'], stats:{posts:0,followers:0,following:0,likes:0,views:0}};
    USERS.push(profile);
  }
  await signInAs(account.id);
  showToast('С возвращением, '+profile.name+'!');
}

/* Swaps ME's contents to point at the given user's profile (by mutating the
   object in place, since ME is a const that many other functions already
   hold a reference to) and starts a session for them. */
async function signInAs(userId){
  const profile = USERS.find(u=>u.id===userId);
  if(!profile) return;
  if(profile !== ME){
    Object.keys(ME).forEach(k=>{ delete ME[k]; });
    Object.assign(ME, profile);
    USERS[0] = ME; // keep ME === USERS[0] invariant other code relies on
    // remove the duplicate now-stale entry that used to live at its old index, if any
    for(let i=USERS.length-1;i>0;i--){ if(USERS[i].id===userId) USERS.splice(i,1); }
  }
  await MentlisDB.set(SESSION_KEY, userId, {silent:true});
  scheduleSave();
  await enterApp();
}

async function signOut(){
  await MentlisDB.set(SESSION_KEY, null, {silent:true});
  location.reload();
}

async function changePassword(oldPw, newPw){
  const accounts = await loadAccounts();
  const account = accounts.find(a=>a.id===ME.id);
  if(!account){
    showToast('Смена пароля недоступна для этой сессии (аккаунт создан до обновления)');
    return false;
  }
  const oldHash = await hashPassword(oldPw);
  if(oldHash !== account.passwordHash){ showToast('Текущий пароль неверен'); return false; }
  account.passwordHash = await hashPassword(newPw);
  await saveAccounts(accounts);
  showToast('Пароль обновлён');
  return true;
}

async function enterApp(){
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  applyTheme(UI.theme||'dark');
  document.body.classList.toggle('true-black', !!UI.trueBlack);
  renderCoinBalance(false);
  renderFeedModeToggle();
  showFeedSkeleton(renderFeed);
  setTimeout(async ()=>{
    const today = new Date().toDateString();
    const last = await MentlisDB.get('mentlis_daily_bonus_'+ME.id);
    if(last!==today){
      awardCoins(20, 'Ежедневный вход', document.getElementById('btn-coins'), 'daily');
      showToast('Ежедневный бонус: +20 🪙');
      MentlisDB.set('mentlis_daily_bonus_'+ME.id, today);
    }
  }, 900);
}

document.querySelectorAll('[data-authtab]').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('[data-authtab]').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const isLogin = tab.dataset.authtab==='login';
    document.getElementById('auth-form-login').style.display = isLogin ? '' : 'none';
    document.getElementById('auth-form-register').style.display = isLogin ? 'none' : '';
  });
});
document.querySelectorAll('.auth-eye').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const input = document.getElementById(btn.dataset.eyefor);
    input.type = input.type==='password' ? 'text' : 'password';
  });
});
document.getElementById('auth-form-login').addEventListener('submit', handleLogin);
document.getElementById('auth-form-register').addEventListener('submit', handleRegister);

(async function boot(){
  await loadPersistedState();

  const accounts = await loadAccounts();
  const sessionId = await MentlisDB.get(SESSION_KEY);
  if(accounts.length===0 || !sessionId){
    // No accounts registered yet, or no active session — show the auth screen
    // instead of dropping straight into the shared demo profile.
    return;
  }
  const sessionProfile = USERS.find(u=>u.id===sessionId);
  if(!sessionProfile){ return; } // stale session pointing at a since-removed profile
  if(sessionProfile !== ME){
    Object.keys(ME).forEach(k=>{ delete ME[k]; });
    Object.assign(ME, sessionProfile);
    USERS[0] = ME;
    for(let i=USERS.length-1;i>0;i--){ if(USERS[i].id===sessionId) USERS.splice(i,1); }
  }
  if(ME.blocked){
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = '';
    showBlockedScreen(ME.blockReason);
    return;
  }
  await enterApp();
})();
})();
</script>
